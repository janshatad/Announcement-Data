<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner — Check</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scanner-wrap {
    width: min(92vw, 720px);
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 5vw, 44px);
  }

  .status {
    min-height: 28px;
    margin-bottom: 18px;
    color: #aaa;
    font-size: 16px;
  }

  #reader {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 18px;
    background: #111;
  }

  .hint {
    margin-top: 16px;
    color: #888;
    font-size: 14px;
  }

  /* Success popup */
  .check-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity .18s ease;
    z-index: 9999;
  }

  .check-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .check-card {
    width: min(82vw, 430px);
    padding: 34px 28px;
    border-radius: 28px;
    background: #111;
    border: 2px solid #20d66b;
    box-shadow: 0 0 60px rgba(32,214,107,.28);
    transform: scale(.85);
    transition: transform .18s ease;
  }

  .check-overlay.show .check-card {
    transform: scale(1);
  }

  .check-icon {
    width: 110px;
    height: 110px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: #20d66b;
    color: #06160d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    font-weight: 900;
  }

  .check-title {
    font-size: 46px;
    font-weight: 900;
    letter-spacing: 2px;
  }

  .check-name {
    margin-top: 8px;
    color: #ccc;
    font-size: 18px;
  }

  .error {
    color: #ff6868;
  }
</style>
</head>

<body>
  <main class="scanner-wrap">
    <h1>QR SCANNER</h1>
    <div id="status" class="status">Starting camera...</div>
    <div id="reader"></div>
    <div class="hint">Scan a registered participant QR code.</div>
  </main>

  <div id="checkOverlay" class="check-overlay" aria-hidden="true">
    <div class="check-card">
      <div class="check-icon">✓</div>
      <div class="check-title">CHECK</div>
      <div id="checkName" class="check-name"></div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://bduudxtfqyswgwimvzpr.supabase.co";
const SUPABASE_KEY = "sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusEl = document.getElementById("status");
const overlay = document.getElementById("checkOverlay");
const checkName = document.getElementById("checkName");

let scanner = null;
let processing = false;

function vibrateSuccess() {
  if ("vibrate" in navigator) {
    // Short double vibration — no audio/TTS.
    navigator.vibrate([120, 70, 120]);
  }
}

function showCheck(name) {
  checkName.textContent = name || "";
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden", "false");

  setTimeout(() => {
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden", "true");
  }, 1300);
}

async function processQr(qrText) {
  if (processing) return;
  processing = true;

  try {
    const qrCode = String(qrText || "").trim();

    if (!qrCode) throw new Error("Empty QR code.");

    statusEl.textContent = "Checking...";

    // Find participant by QR code.
    const { data: participant, error: participantError } =
      await supabaseClient
        .from("participants")
        .select("id,name,position,organization,qr_code")
        .eq("qr_code", qrCode)
        .maybeSingle();

    if (participantError) throw participantError;

    if (!participant) {
      statusEl.innerHTML =
        '<span class="error">QR code not registered.</span>';

      if ("vibrate" in navigator) {
        navigator.vibrate([250, 80, 250]);
      }

      setTimeout(() => {
        statusEl.textContent = "Ready to scan.";
      }, 1500);

      return;
    }

    // Record the scan. This triggers the LED Wall display.
    const { error: historyError } = await supabaseClient
      .from("scan_history")
      .insert({
        participant_id: participant.id,
        scanner_name: "QR Scanner"
      });

    if (historyError) throw historyError;

    // Scanner itself does NOT use TTS.
    vibrateSuccess();
    showCheck(participant.name);

    statusEl.textContent = "Ready to scan.";

  } catch (error) {
    console.error(error);
    statusEl.innerHTML =
      '<span class="error">Scan error. Please try again.</span>';

    if ("vibrate" in navigator) {
      navigator.vibrate([250, 80, 250]);
    }

    setTimeout(() => {
      statusEl.textContent = "Ready to scan.";
    }, 1800);
  } finally {
    // Prevent duplicate scans from the same QR while the popup is showing.
    setTimeout(() => {
      processing = false;
    }, 1500);
  }
}

async function startScanner() {
  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const size = Math.min(viewfinderWidth, viewfinderHeight) * 0.72;
      return { width: size, height: size };
    },
    aspectRatio: 1.0
  };

  try {
    await scanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => processQr(decodedText),
      () => {}
    );

    statusEl.textContent = "Ready to scan.";
  } catch (error) {
    console.error(error);
    statusEl.innerHTML =
      '<span class="error">Camera could not start. Allow camera permission and reload.</span>';
  }
}

window.addEventListener("load", startScanner);
</script>
</body>
</html>
