<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Admin - QR Event Information System</title>

<link rel="stylesheet" href="style.css">

<!-- QR CODE LIBRARY -->
<script
    src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js">
</script>

</head>


<body>


<main class="wrap">


<!-- =====================================================
     HEADER
===================================================== -->

<section class="panel">

    <h1>
        👤 Participant Registration
    </h1>

    <p class="muted">
        Register participants and generate their QR codes.
    </p>

</section>



<!-- =====================================================
     REGISTRATION
===================================================== -->

<section class="panel grid">


<form id="participantForm">


<!-- QR ID -->

<div class="field">

    <label for="qr">
        QR / Participant ID
    </label>

    <input
        id="qr"
        type="text"
        placeholder="SM-2026-0001"
        autocomplete="off"
        required
    >

</div>



<!-- NAME -->

<div class="field">

    <label for="name">
        Full Name
    </label>

    <input
        id="name"
        type="text"
        placeholder="Juan Dela Cruz"
        required
    >

</div>



<!-- POSITION -->

<div class="field">

    <label for="position">
        Position
    </label>

    <input
        id="position"
        type="text"
        placeholder="Municipal Employee"
    >

</div>



<!-- ORGANIZATION -->

<div class="field">

    <label for="org">
        Organization
    </label>

    <input
        id="org"
        type="text"
        placeholder="Municipality of San Miguel"
    >

</div>



<!-- MESSAGE -->

<div class="field">

    <label for="message">
        Message
    </label>

    <textarea
        id="message"
        rows="4"
        placeholder="Welcome to the event!"
    >Welcome to the event!</textarea>

</div>



<!-- PHOTO -->

<div class="field">

    <label for="photo">
        Participant Photo
    </label>

    <input
        id="photo"
        type="file"
        accept="image/*"
    >

</div>



<!-- PHOTO PREVIEW -->

<div
    id="photoPreviewBox"
    style="
        display:none;
        margin:15px 0;
        text-align:center;
    "
>

    <p
        style="
            margin-bottom:8px;
            font-weight:bold;
        "
    >
        Photo Preview
    </p>

    <img
        id="preview"
        alt="Participant Photo Preview"
        style="
            display:block;
            width:180px;
            height:180px;
            object-fit:cover;
            border-radius:12px;
            margin:0 auto;
            border:3px solid rgba(255,255,255,.15);
            box-shadow:0 5px 20px rgba(0,0,0,.25);
        "
    >

    <p
        id="photoName"
        class="muted"
        style="margin-top:8px;"
    ></p>

</div>



<!-- BUTTONS -->

<div
    class="actions"
    style="
        display:flex;
        gap:10px;
        flex-wrap:wrap;
    "
>

    <button
        id="saveBtn"
        class="primary"
        type="button"
    >
        SAVE PARTICIPANT
    </button>


    <button
        id="clearBtn"
        type="button"
    >
        CLEAR FORM
    </button>

</div>



<!-- STATUS -->

<div
    id="status"
    class="status"
    style="margin-top:15px;"
>
    Ready.
</div>


</form>



<!-- =====================================================
     QR CODE
===================================================== -->

<div>

    <h2>
        QR Code
    </h2>


    <div
        class="qr-box"
        style="
            text-align:center;
            padding:20px;
        "
    >

        <canvas
            id="qrCanvas"
            width="260"
            height="260"
        ></canvas>

    </div>


    <p
        id="qrLabel"
        class="muted"
    >
        Save a participant to generate the QR.
    </p>


    <div
        class="actions"
        style="
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        "
    >

        <button
            id="downloadQR"
            type="button"
        >
            DOWNLOAD QR
        </button>


        <button
            id="printQR"
            type="button"
        >
            PRINT QR
        </button>

    </div>

</div>


</section>



<!-- =====================================================
     PARTICIPANT LIST
===================================================== -->

<section class="panel">

    <h2>
        Registered Participants
    </h2>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Photo
                    </th>

                    <th>
                        QR ID
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Position
                    </th>

                    <th>
                        Organization
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="rows">

                <tr>

                    <td
                        colspan="6"
                        style="text-align:center;"
                    >
                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


</main>



<!-- =====================================================
     SUPABASE CONFIG
===================================================== -->

<script src="config.js"></script>



<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
    window.SUPABASE_URL;

const SUPABASE_KEY =
    window.SUPABASE_PUBLISHABLE_KEY;


/* =====================================================
   ELEMENT HELPER
===================================================== */

function $(id) {

    return document.getElementById(id);

}


/* =====================================================
   VARIABLES
===================================================== */

let currentId = "";

let currentPhoto = "";


/* =====================================================
   STATUS
===================================================== */

function status(message, success = false) {

    const box =
        $("status");

    box.textContent =
        message;

    box.className =
        success
        ? "status success"
        : "status";

}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

$("photo").addEventListener(
    "change",
    function () {

        const file =
            this.files &&
            this.files[0];


        const preview =
            $("preview");


        const previewBox =
            $("photoPreviewBox");


        const photoName =
            $("photoName");


        /* No file */

        if (!file) {

            preview.removeAttribute(
                "src"
            );

            previewBox.style.display =
                "none";

            photoName.textContent =
                "";

            return;

        }


        /* Make sure it is an image */

        if (
            !file.type ||
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image file."
            );

            this.value =
                "";

            previewBox.style.display =
                "none";

            return;

        }


        /* Create temporary URL */

        const imageURL =
            URL.createObjectURL(
                file
            );


        /* Display preview */

        preview.onload =
            function () {

                previewBox.style.display =
                    "block";

                photoName.textContent =
                    file.name +
                    " • " +
                    formatFileSize(
                        file.size
                    );

                URL.revokeObjectURL(
                    imageURL
                );

            };


        preview.onerror =
            function () {

                previewBox.style.display =
                    "none";

                URL.revokeObjectURL(
                    imageURL
                );

                alert(
                    "Unable to preview this image."
                );

            };


        preview.src =
            imageURL;

    }
);



/* =====================================================
   FILE SIZE
===================================================== */

function formatFileSize(bytes) {

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (
            (bytes / 1024)
            .toFixed(1)
            +
            " KB"
        );

    return (
        (bytes / (1024 * 1024))
        .toFixed(1)
        +
        " MB"
    );

}



/* =====================================================
   PHOTO UPLOAD
===================================================== */

async function uploadPhoto(
    file,
    qr
) {


    const extension =

        (
            file.name
            .split(".")
            .pop()
            ||
            "jpg"
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        )
        ||
        "jpg";


    const safeQR =

        qr
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const filename =

        safeQR +
        "-" +
        Date.now() +
        "." +
        extension;


    const uploadURL =

        SUPABASE_URL.replace(
            /\/$/,
            ""
        )
        +
        "/storage/v1/object/participant-photos/"
        +
        encodeURIComponent(
            filename
        );


    status(
        "Uploading photo..."
    );


    let response;


    try {

        response =
            await fetch(
                uploadURL,
                {

                    method:
                        "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            file.type ||
                            "image/jpeg",

                        "x-upsert":
                            "false"

                    },

                    body:
                        file

                }
            );

    }

    catch (error) {

        throw new Error(
            "Photo upload connection failed: " +
            error.message
        );

    }


    const responseText =
        await response.text();


    if (!response.ok) {

        let errorMessage =
            responseText;


        try {

            const json =
                JSON.parse(
                    responseText
                );


            errorMessage =
                json.message ||
                json.error ||
                json.details ||
                responseText;

        }

        catch (e) {}


        throw new Error(
            "Storage error " +
            response.status +
            ": " +
            errorMessage
        );

    }


    /* PUBLIC URL */

    const publicURL =

        SUPABASE_URL.replace(
            /\/$/,
            ""
        )
        +
        "/storage/v1/object/public/participant-photos/"
        +
        encodeURIComponent(
            filename
        );


    return publicURL;

}



/* =====================================================
   SAVE PARTICIPANT
===================================================== */

async function saveParticipant() {


    console.log(
        "SAVE PARTICIPANT CLICKED"
    );


    const qr =
        $("qr")
        .value
        .trim();


    const name =
        $("name")
        .value
        .trim();


    /* Validate */

    if (!qr) {

        status(
            "Please enter the QR / Participant ID."
        );

        $("qr").focus();

        return;

    }


    if (!name) {

        status(
            "Please enter the participant name."
        );

        $("name").focus();

        return;

    }


    const button =
        $("saveBtn");


    button.disabled =
        true;


    button.textContent =
        "SAVING...";


    try {


        /* =========================================
           PHOTO
        ========================================= */


        let photoURL =
            currentPhoto;


        const file =
            $("photo")
            .files[0];


        if (file) {

            photoURL =
                await uploadPhoto(
                    file,
                    qr
                );

        }


        /* =========================================
           DATABASE
        ========================================= */


        status(
            "Saving participant information..."
        );


        const participant = {

            qr_code:
                qr,

            name:
                name,

            position:
                $("position")
                .value
                .trim(),

            organization:
                $("org")
                .value
                .trim(),

            message:
                $("message")
                .value
                .trim(),

            photo_url:
                photoURL ||
                ""

        };


        const databaseURL =

            SUPABASE_URL.replace(
                /\/$/,
                ""
            )
            +
            "/rest/v1/participants"
            +
            "?on_conflict=qr_code";


        let response;


        try {

            response =
                await fetch(
                    databaseURL,
                    {

                        method:
                            "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "resolution=merge-duplicates,return=minimal"

                        },

                        body:
                            JSON.stringify(
                                participant
                            )

                    }
                );

        }

        catch (error) {

            throw new Error(
                "Database connection failed: " +
                error.message
            );

        }


        const responseText =
            await response.text();


        if (!response.ok) {

            let errorMessage =
                responseText;


            try {

                const json =
                    JSON.parse(
                        responseText
                    );


                errorMessage =
                    json.message ||
                    json.details ||
                    json.hint ||
                    json.error ||
                    responseText;

            }

            catch (e) {}


            throw new Error(
                "Database error " +
                response.status +
                ": " +
                errorMessage
            );

        }


        /* =========================================
           SUCCESS
        ========================================= */


        currentId =
            qr;


        currentPhoto =
            photoURL;


        status(
            "✅ PARTICIPANT SAVED SUCCESSFULLY!",
            true
        );


        /* Generate QR */

        generateQR(
            qr
        );


        /* Refresh list */

        loadParticipants();


    }

    catch (error) {

        console.error(
            "SAVE ERROR:",
            error
        );


        status(
            "❌ " +
            error.message
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "SAVE PARTICIPANT";

    }

}



/* =====================================================
   GENERATE QR
===================================================== */

async function generateQR(
    value
) {


    try {


        if (
            typeof QRCode ===
            "undefined"
        ) {

            throw new Error(
                "QR library did not load."
            );

        }


        await QRCode.toCanvas(
            $("qrCanvas"),
            value,
            {

                width:
                    260,

                margin:
                    2,

                errorCorrectionLevel:
                    "M"

            }
        );


        $("qrLabel")
            .textContent =
            "QR ID: " +
            value;


    }

    catch (error) {

        console.error(
            "QR ERROR:",
            error
        );

    }

}



/* =====================================================
   CLEAR FORM
===================================================== */

$("clearBtn").addEventListener(
    "click",
    function () {


        $("participantForm")
            .reset();


        $("message")
            .value =
            "Welcome to the event!";


        $("preview")
            .removeAttribute(
                "src"
            );


        $("photoPreviewBox")
            .style.display =
            "none";


        $("photoName")
            .textContent =
            "";


        currentId =
            "";


        currentPhoto =
            "";


        $("qrLabel")
            .textContent =
            "Save a participant to generate the QR.";


        status(
            "Form cleared."
        );

    }
);



/* =====================================================
   DOWNLOAD QR
===================================================== */

$("downloadQR").addEventListener(
    "click",
    function () {


        if (!currentId) {

            alert(
                "Save a participant first."
            );

            return;

        }


        const link =
            document.createElement(
                "a"
            );


        link.download =
            currentId +
            ".png";


        link.href =
            $("qrCanvas")
            .toDataURL(
                "image/png"
            );


        link.click();

    }
);



/* =====================================================
   PRINT QR
===================================================== */

$("printQR").addEventListener(
    "click",
    function () {


        if (!currentId) {

            alert(
                "Save a participant first."
            );

            return;

        }


        const image =
            $("qrCanvas")
            .toDataURL(
                "image/png"
            );


        const printWindow =
            window.open(
                "",
                "_blank"
            );


        printWindow.document.write(`

            <!doctype html>

            <html>

            <head>

                <title>
                    ${escapeHTML(currentId)}
                </title>

            </head>

            <body
                style="
                    text-align:center;
                    font-family:Arial;
                "
            >

                <h2>
                    ${escapeHTML(currentId)}
                </h2>

                <img
                    src="${image}"
                    style="width:300px;"
                >

                <p>
                    Scan ID:
                    ${escapeHTML(currentId)}
                </p>

            </body>

            </html>

        `);


        printWindow.document.close();


        printWindow.focus();


        setTimeout(
            function () {

                printWindow.print();

            },
            300
        );

    }
);



/* =====================================================
   LOAD PARTICIPANTS
===================================================== */

async function loadParticipants() {


    const url =

        SUPABASE_URL.replace(
            /\/$/,
            ""
        )
        +
        "/rest/v1/participants"
        +
        "?select=*"
        +
        "&order=created_at.desc"
        +
        "&limit=100";


    try {


        const response =
            await fetch(
                url,
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const responseText =
            await response.text();


        if (!response.ok) {

            throw new Error(
                responseText
            );

        }


        const data =
            JSON.parse(
                responseText
            );


        const rows =
            $("rows");


        rows.innerHTML =
            "";


        if (
            !data ||
            data.length === 0
        ) {


            rows.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        style="text-align:center;"
                    >
                        No participants yet.
                    </td>

                </tr>

            `;


            return;

        }


        data.forEach(
            function (p) {


                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.innerHTML = `

                    <td>

                        ${
                            p.photo_url

                            ?

                            `
                            <img
                                src="${escapeHTML(p.photo_url)}"
                                alt=""
                                style="
                                    width:55px;
                                    height:55px;
                                    object-fit:cover;
                                    border-radius:8px;
                                "
                            >
                            `

                            :

                            "—"
                        }

                    </td>


                    <td>
                        ${escapeHTML(p.qr_code)}
                    </td>


                    <td>
                        ${escapeHTML(p.name)}
                    </td>


                    <td>
                        ${escapeHTML(p.position || "")}
                    </td>


                    <td>
                        ${escapeHTML(p.organization || "")}
                    </td>


                    <td>

                        <button
                            type="button"
                            class="loadParticipant"
                        >
                            LOAD
                        </button>

                    </td>

                `;


                rows.appendChild(
                    tr
                );


                tr.querySelector(
                    ".loadParticipant"
                )
                .addEventListener(
                    "click",
                    function () {

                        loadParticipant(
                            p.qr_code
                        );

                    }
                );

            }
        );


    }

    catch (error) {

        console.error(
            "LOAD PARTICIPANTS ERROR:",
            error
        );


        $("rows").innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="text-align:center;"
                >
                    Unable to load participants.
                </td>

            </tr>

        `;

    }

}



/* =====================================================
   LOAD PARTICIPANT
===================================================== */

async function loadParticipant(
    id
) {


    const url =

        SUPABASE_URL.replace(
            /\/$/,
            ""
        )
        +
        "/rest/v1/participants"
        +
        "?select=*"
        +
        "&qr_code=eq."
        +
        encodeURIComponent(
            id
        );


    try {


        const response =
            await fetch(
                url,
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.length
        ) {

            throw new Error(
                "Participant not found."
            );

        }


        const p =
            data[0];


        $("qr").value =
            p.qr_code || "";


        $("name").value =
            p.name || "";


        $("position").value =
            p.position || "";


        $("org").value =
            p.organization || "";


        $("message").value =
            p.message ||
            "";


        currentId =
            p.qr_code ||
            "";


        currentPhoto =
            p.photo_url ||
            "";


        /* Existing photo */

        if (
            p.photo_url
        ) {

            $("preview").src =
                p.photo_url;


            $("photoPreviewBox")
                .style.display =
                "block";


            $("photoName")
                .textContent =
                "Saved participant photo";

        }


        generateQR(
            p.qr_code
        );


        status(
            "Participant loaded.",
            true
        );


    }

    catch (error) {

        alert(
            error.message
        );

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {


    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        function (character) {


            return {

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            }[character];


        }
    );

}



/* =====================================================
   SAVE BUTTON
===================================================== */

$("saveBtn").onclick =
    function () {

        saveParticipant();

    };



/* =====================================================
   START
===================================================== */

console.log(
    "QR Admin System loaded."
);


console.log(
    "Supabase URL:",
    SUPABASE_URL
);


/* Load existing participants */

loadParticipants();

</script>


</body>
</html>
