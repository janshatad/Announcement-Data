<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — QR Event System</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>
<main class="wrap">
  <div class="panel"><h1>👤 Participant Registration</h1><p class="muted">Create a participant, upload a picture, and generate a QR code.</p></div>

  <section class="panel grid">
    <form id="form">
      <div class="field"><label for="qr">QR / Participant ID</label><input id="qr" placeholder="SM-2026-0001" required></div>
      <div class="field"><label for="name">Full Name</label><input id="name" required></div>
      <div class="field"><label for="position">Position</label><input id="position"></div>
      <div class="field"><label for="org">Organization</label><input id="org"></div>
      <div class="field"><label for="message">Message</label><textarea id="message">Welcome to the event!</textarea></div>
      <div class="field"><label for="photo">Picture</label><input id="photo" type="file" accept="image/*"></div>
      <img id="preview" class="photo-preview" alt="Photo preview">
      <div class="actions">
        <button class="primary" type="submit">SAVE PARTICIPANT</button>
        <button type="button" id="reset">CLEAR FORM</button>
      </div>
      <div id="status" class="status">Ready.</div><div class="muted" style="margin-top:8px;font-size:.85rem">Storage bucket: <b>participant-photos</b> · If an upload fails, the page now shows the HTTP/network reason.</div>
    </form>

    <div>
      <h2>QR Code</h2>
      <div id="qrBox" class="qr-box"><canvas id="qrCanvas" width="260" height="260"></canvas></div>
      <p id="qrLabel" class="muted">Save a participant to generate the QR.</p>
      <div class="actions">
        <button id="downloadQR" type="button">DOWNLOAD QR</button>
        <button id="printQR" type="button">PRINT QR</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Participants</h2>
    <div class="table-wrap"><table><thead><tr><th>Photo</th><th>QR ID</th><th>Name</th><th>Position</th><th>Organization</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>

<script src="config.js"></script>
<script>
const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let currentId="", currentPhoto="";

$("photo").addEventListener("change",()=>{
  const f=$("photo").files[0];
  if(f) $("preview").src=URL.createObjectURL(f);
});
function msg(t,ok=false){$("status").textContent=t;$("status").className="status "+(ok?"success":"error")}
async function uploadPhotoDirect(file, qr){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const safeQr=qr.replace(/[^a-zA-Z0-9_-]/g,"_");
  const path=safeQr+"-"+Date.now()+"."+ext;
  const endpoint=window.SUPABASE_URL.replace(/\\/$/,"")+
    "/storage/v1/object/participant-photos/"+encodeURIComponent(path);

  // Use the browser-safe publishable key for the Storage request.
  // This avoids hiding the useful Storage error behind a generic SDK "Failed to fetch".
  let response;
  try{
    response=await fetch(endpoint,{
      method:"POST",
      headers:{
        "apikey":window.SUPABASE_PUBLISHABLE_KEY,
        "Authorization":"Bearer "+window.SUPABASE_PUBLISHABLE_KEY,
        "Content-Type":file.type || "application/octet-stream",
        "x-upsert":"false",
        "cache-control":"3600"
      },
      body:file
    });
  }catch(err){
    throw new Error("Network/CORS error while contacting Supabase Storage. "+(err?.message||err));
  }

  let bodyText="";
  try{ bodyText=await response.text(); }catch(_){}

  if(!response.ok){
    let detail=bodyText;
    try{
      const j=JSON.parse(bodyText);
      detail=j.message || j.error || bodyText;
    }catch(_){}
    throw new Error("Storage HTTP "+response.status+": "+(detail||response.statusText||"Upload rejected"));
  }

  return db.storage.from("participant-photos").getPublicUrl(path).data.publicUrl;
}

async function saveParticipant(e){
  if(e && e.preventDefault) e.preventDefault();

  const btn=$("saveBtn");
  if(btn && btn.dataset.saving==="1") return;

  const qr=$("qr").value.trim(), name=$("name").value.trim();
  if(!qr||!name){msg("QR ID and name are required.");return}

  const file=$("photo").files[0];
  let photo_url=currentPhoto;

  if(btn){
    btn.dataset.saving="1";
    btn.disabled=true;
    btn.textContent="SAVING...";
  }

  try{
    if(file){
      msg("1/2 Uploading photo...");
      photo_url=await uploadPhotoDirect(file,qr);
      msg("2/2 Photo uploaded. Saving participant...");
    }else{
      msg("Saving participant...");
    }

    const row={
      qr_code:qr,
      name:name,
      position:$("position").value.trim(),
      organization:$("org").value.trim(),
      message:$("message").value.trim(),
      photo_url:photo_url || ""
    };

    const endpoint=window.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/participants";
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);

    let response;
    try{
      response=await fetch(endpoint,{
        method:"POST",
        headers:{
          "apikey":window.SUPABASE_PUBLISHABLE_KEY,
          "Authorization":"Bearer "+window.SUPABASE_PUBLISHABLE_KEY,
          "Content-Type":"application/json",
          "Prefer":"resolution=merge-duplicates,return=minimal"
        },
        body:JSON.stringify(row),
        signal:controller.signal
      });
    }catch(err){
      if(err?.name==="AbortError")
        throw new Error("Database request timed out after 15 seconds.");
      throw new Error("Database network/CORS error: "+(err?.message||err));
    }finally{
      clearTimeout(timer);
    }

    const bodyText=await response.text();
    if(!response.ok){
      let detail=bodyText;
      try{
        const j=JSON.parse(bodyText);
        detail=j.message||j.details||j.hint||j.error||bodyText;
      }catch(_){}
      throw new Error("Database HTTP "+response.status+": "+(detail||response.statusText||"Save rejected"));
    }

    currentId=qr;
    currentPhoto=photo_url||"";

    // Show success immediately. QR generation cannot prevent the participant from being saved.
    msg("✅ PARTICIPANT SAVED SUCCESSFULLY!",true);

    try{
      await makeQR(qr);
    }catch(qrErr){
      console.warn("QR generation error:",qrErr);
    }

    try{ await loadRows(); }catch(_){}

  }catch(err){
    console.error("Participant save error:",err);
    msg("❌ SAVE FAILED: "+(err?.message||String(err)));
  }finally{
    if(btn){
      btn.dataset.saving="0";
      btn.disabled=false;
      btn.textContent="SAVE PARTICIPANT";
    }
  }
}
async function makeQR(value){
  await QRCode.toCanvas($("qrCanvas"),value,{width:260,margin:2,errorCorrectionLevel:"M"});
  $("qrLabel").textContent="QR ID: "+value;
}
$("saveBtn").addEventListener("click",()=>saveParticipant({preventDefault:()=>{}}));
$("form").addEventListener("submit",(e)=>{e.preventDefault();saveParticipant(e);});
$("reset").onclick=()=>{
  $("form").reset();
  $("preview").removeAttribute("src");
  $("qrLabel").textContent="Save a participant to generate the QR.";
  currentId="";
  currentPhoto="";
  msg("Form cleared.");
};
$("downloadQR").onclick=()=>{
  if(!currentId){alert("Save a participant first.");return}
  const a=document.createElement("a");a.download=currentId+".png";a.href=$("qrCanvas").toDataURL("image/png");a.click();
};
$("printQR").onclick=()=>{
  if(!currentId){alert("Save a participant first.");return}
  const w=window.open("","_blank");w.document.write("<html><body style='text-align:center;font-family:Arial'><h2>"+currentId+"</h2><img src='"+$("qrCanvas").toDataURL("image/png")+"' style='width:300px'><p>Scan ID: "+currentId+"</p></body></html>");w.document.close();w.print();
};
async function loadRows(){
  const {data,error}=await db.from("participants").select("*").order("created_at",{ascending:false}).limit(100);
  if(error){$("rows").innerHTML="<tr><td colspan='6'>"+error.message+"</td></tr>";return}
  $("rows").innerHTML=data.map(p=>`<tr><td>${p.photo_url?`<img class="thumb" src="${p.photo_url}" alt="">`:"—"}</td><td>${esc(p.qr_code)}</td><td>${esc(p.name)}</td><td>${esc(p.position||"")}</td><td>${esc(p.organization||"")}</td><td><button type="button" data-id="${esc(p.qr_code)}">LOAD</button></td></tr>`).join("");
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>loadOne(b.dataset.id));
}
async function loadOne(id){
  const {data,error}=await db.from("participants").select("*").eq("qr_code",id).single();
  if(error)return alert(error.message);
  $("qr").value=data.qr_code;$("name").value=data.name;$("position").value=data.position||"";$("org").value=data.organization||"";$("message").value=data.message||"";currentPhoto=data.photo_url||"";if(data.photo_url)$("preview").src=data.photo_url;currentId=data.qr_code;makeQR(data.qr_code);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
loadRows();
</script>
</body>
</html>
