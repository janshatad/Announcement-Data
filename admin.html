<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — QR Event System</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9;color:#0f172a}.container{max-width:1200px;margin:auto;padding:24px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 25px #00000012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.primary{background:#2563eb;color:#fff}.secondary{background:#475569;color:#fff}.success{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{display:none;margin-top:14px;padding:12px;border-radius:8px;white-space:pre-wrap}.status.ok{display:block;background:#dcfce7;color:#166534}.status.err{display:block;background:#fee2e2;color:#991b1b}.status.info{display:block;background:#e0f2fe;color:#075985}.preview{text-align:center}.preview img{display:none;max-width:180px;max-height:180px;margin:12px auto;border-radius:12px}.qrbox{text-align:center}.qrbox #qrcode{display:inline-block;padding:12px}.qrid{font-weight:800;color:#2563eb;margin:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}.thumb{width:50px;height:50px;object-fit:cover;border-radius:8px}.muted{color:#64748b;font-size:13px}</style></head><body><div class="container">
<div class="card"><h1>QR Event System — Admin</h1><div id="modeLabel" class="muted">Adding new participant</div><form id="participantForm"><input type="hidden" id="editId"><div class="grid"><div><label>QR Code ID</label><input id="qr_code" required placeholder="SM-2026-0001"></div><div><label>Name</label><input id="name" required placeholder="Participant name"></div><div><label>Position</label><input id="position"></div><div><label>Organization</label><input id="organization"></div></div><label>Message</label><textarea id="message"></textarea><label>Participant Photo</label><input id="photo" type="file" accept="image/*"><div id="photoStatus" class="muted">No new photo selected.</div><div class="preview"><img id="photoPreview"></div><div class="actions"><button class="primary" id="saveBtn">SAVE PARTICIPANT</button><button class="secondary" id="cancelEdit" type="button" style="display:none">CANCEL EDIT</button><button class="secondary" id="clearBtn" type="button">CLEAR</button></div></form><div id="status" class="status"></div></div>
<div class="grid"><div class="card qrbox"><h2>QR Code</h2><div id="qrcode"></div><div id="qrIdDisplay" class="qrid">No QR generated</div><button id="downloadQR" class="success" disabled>DOWNLOAD QR</button></div><div class="card"><h2>LED Wall TTS Settings</h2><p class="muted">Settings are stored in Supabase and used by the LED Wall.</p><label>Auto TTS</label><select id="ttsEnabled"><option value="true">Enabled</option><option value="false">Disabled</option></select><label>Voice</label><select id="ttsVoice"><option value="">Default / Automatic</option></select><div class="grid"><div><label>Rate</label><input id="ttsRate" type="number" min="0.5" max="2" step="0.1" value="1"></div><div><label>Pitch</label><input id="ttsPitch" type="number" min="0" max="2" step="0.1" value="1"></div><div><label>Volume</label><input id="ttsVolume" type="number" min="0" max="1" step="0.1" value="1"></div></div><div class="actions"><button class="primary" id="saveTTS">SAVE TTS SETTINGS</button><button class="secondary" id="testTTS">TEST VOICE</button></div><div id="ttsStatus" class="status"></div></div></div>
<div class="card"><h2>Registered Participants</h2><div class="tablewrap"><table><thead><tr><th>Photo</th><th>QR ID</th><th>Name</th><th>Position</th><th>Organization</th><th>Actions</th></tr></thead><tbody id="participants"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div></div>
<script>
const URL="https://bduudxtfqyswgwimvzpr.supabase.co",KEY="sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop",BUCKET="participant-photos";const $=id=>document.getElementById(id);let rows=[],voices=[];
async function req(ep,opt={}){const r=await fetch(URL+ep,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opt.headers||{})}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error("HTTP "+r.status+"\n"+(d?.message||d?.error||d||""));return d}
function msg(el,text,type){el.className="status "+type;el.textContent=text;el.style.display="block"}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
$("photo").onchange=()=>{const f=$("photo").files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{$("photoPreview").src=e.target.result;$("photoPreview").style.display="block";$('photoStatus').textContent=f.name};r.readAsDataURL(f)};
async function upload(f,qr){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=qr+'-'+Date.now()+'.'+ext;const r=await fetch(URL+'/storage/v1/object/'+BUCKET+'/'+encodeURIComponent(path),{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':f.type||'application/octet-stream','x-upsert':'true'},body:f});if(!r.ok)throw new Error('Photo upload failed\nHTTP '+r.status+'\n'+await r.text());return URL+'/storage/v1/object/public/'+BUCKET+'/'+encodeURIComponent(path)}
function qr(id){$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:id,width:250,height:250,correctLevel:QRCode.CorrectLevel.H});$('qrIdDisplay').textContent='QR ID: '+id;$('downloadQR').disabled=false;$('downloadQR').dataset.qr=id}
$('downloadQR').onclick=()=>{const c=$('qrcode').querySelector('canvas'),i=$('qrcode').querySelector('img'),u=c?c.toDataURL('image/png'):i?.src;if(!u)return;const a=document.createElement('a');a.href=u;a.download=( $('downloadQR').dataset.qr||'participant')+'-QR.png';a.click()}
function reset(){ $('participantForm').reset();$('editId').value='';$('modeLabel').textContent='Adding new participant';$('saveBtn').textContent='SAVE PARTICIPANT';$('cancelEdit').style.display='none';$('photoPreview').style.display='none';$('photoStatus').textContent='No new photo selected';$('status').style.display='none'}$('clearBtn').onclick=reset;$('cancelEdit').onclick=reset;
$('participantForm').onsubmit=async e=>{e.preventDefault();$('saveBtn').disabled=true;$('saveBtn').textContent='SAVING...';try{const id=$('editId').value,code=$('qr_code').value.trim(),name=$('name').value.trim(),f=$('photo').files?.[0];if(!code||!name)throw new Error('QR Code ID and Name are required.');let photo=null;if(f){msg($('status'),'Uploading photo...','info');photo=await upload(f,code)}const p={qr_code:code,name,position:$('position').value.trim(),organization:$('organization').value.trim(),message:$('message').value.trim(),updated_at:new Date().toISOString()};if(photo)p.photo_url=photo;if(id)await req('/rest/v1/participants?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(p)});else{p.photo_url=photo||'';await req('/rest/v1/participants?on_conflict=qr_code',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(p)})}qr(code);msg($('status'),(id?'PARTICIPANT UPDATED SUCCESSFULLY!':'PARTICIPANT SAVED SUCCESSFULLY!')+'\n\nQR ID: '+code,'ok');await load();if(id)reset()}catch(e){msg($('status'),'OPERATION FAILED\n\n'+e.message,'err')}finally{$('saveBtn').disabled=false;if(!$('editId').value)$('saveBtn').textContent='SAVE PARTICIPANT'}};
async function load(){try{rows=await req('/rest/v1/participants?select=*&order=created_at.desc')||[];$('participants').innerHTML=rows.length?rows.map(p=>`<tr><td>${p.photo_url?`<img class="thumb" src="${esc(p.photo_url)}">`:'—'}</td><td><b>${esc(p.qr_code)}</b></td><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${esc(p.organization)}</td><td><button class="primary" onclick="edit(${p.id})">EDIT</button> <button class="danger" onclick="del(${p.id})">DELETE</button> <button class="secondary" onclick="qr('${String(p.qr_code).replaceAll("'","\\'")}')">QR</button></td></tr>`).join(''):'<tr><td colspan="6">No participants registered.</td></tr>'}catch(e){$('participants').innerHTML='<tr><td colspan="6" style="color:red">'+esc(e.message)+'</td></tr>'}}
window.edit=id=>{const p=rows.find(x=>Number(x.id)===Number(id));if(!p)return;$('editId').value=p.id;$('qr_code').value=p.qr_code;$('name').value=p.name;$('position').value=p.position||'';$('organization').value=p.organization||'';$('message').value=p.message||'';$('photo').value='';$('modeLabel').textContent='Editing: '+p.name;$('saveBtn').textContent='UPDATE PARTICIPANT';$('cancelEdit').style.display='inline-block';if(p.photo_url){$('photoPreview').src=p.photo_url;$('photoPreview').style.display='block'}qr(p.qr_code);scrollTo({top:0,behavior:'smooth'})};window.del=async id=>{const p=rows.find(x=>Number(x.id)===Number(id));if(!p||!confirm('Delete this participant?\n\n'+p.name+'\n'+p.qr_code))return;try{const deleted=await req('/rest/v1/participants?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=representation'}});if(!Array.isArray(deleted)||deleted.length===0)throw new Error('The participant was not deleted. Check that the DELETE policy for public.participants is enabled in Supabase.');msg($('status'),'PARTICIPANT DELETED SUCCESSFULLY.\n\n'+p.name,'ok');await load()}catch(e){msg($('status'),'DELETE FAILED\n\n'+e.message,'err')}};
function loadVoices(){if(!speechSynthesis)return;voices=speechSynthesis.getVoices()||[];const s=$('ttsVoice'),cur=s.dataset.current||'';s.innerHTML='<option value="">Default / Automatic</option>';voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' — '+v.lang;if(v.name===cur)o.selected=true;s.appendChild(o)})}if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
async function loadTTS(){try{const a=await req('/rest/v1/system_settings?select=*&id=eq.1');const s=a?.[0];if(!s)return;$('ttsEnabled').value=String(s.tts_enabled);$('ttsRate').value=s.tts_rate;$('ttsPitch').value=s.tts_pitch;$('ttsVolume').value=s.tts_volume;$('ttsVoice').dataset.current=s.tts_voice||'';loadVoices()}catch(e){msg($('ttsStatus'),e.message,'err')}}
$('saveTTS').onclick=async()=>{try{await req('/rest/v1/system_settings?id=eq.1',{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({tts_enabled:$('ttsEnabled').value==='true',tts_voice:$('ttsVoice').value,tts_rate:Number($('ttsRate').value),tts_pitch:Number($('ttsPitch').value),tts_volume:Number($('ttsVolume').value),updated_at:new Date().toISOString()})});msg($('ttsStatus'),'TTS SETTINGS SAVED.','ok')}catch(e){msg($('ttsStatus'),'TTS SAVE FAILED\n\n'+e.message,'err')}};$('testTTS').onclick=()=>{if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance('Now welcoming Test Participant. Guest. From San Miguel. Welcome to the event!');const v=voices.find(x=>x.name===$('ttsVoice').value);if(v)u.voice=v;u.rate=Number($('ttsRate').value);u.pitch=Number($('ttsPitch').value);u.volume=Number($('ttsVolume').value);speechSynthesis.cancel();speechSynthesis.speak(u)};
load();loadTTS();
</script></body></html>
