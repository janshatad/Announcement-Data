<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - QR Event System</title>

<link rel="stylesheet" href="style.css">

<!-- QR Generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

</head>

<body>

<main class="wrap">

<div class="panel">
    <h1>👤 Participant Registration</h1>
    <p class="muted">
        Create a participant, upload a picture, and generate a QR code.
    </p>
</div>


<section class="panel grid">

<form id="participantForm">

    <div class="field">
        <label>QR / Participant ID</label>
        <input
            id="qr"
            type="text"
            placeholder="SM-2026-0001"
            required
        >
    </div>


    <div class="field">
        <label>Full Name</label>
        <input
            id="name"
            type="text"
            required
        >
    </div>


    <div class="field">
        <label>Position</label>
        <input
            id="position"
            type="text"
        >
    </div>


    <div class="field">
        <label>Organization</label>
        <input
            id="org"
            type="text"
        >
    </div>


    <div class="field">
        <label>Message</label>

        <textarea id="message">Welcome to the event!</textarea>
    </div>


    <div class="field">
        <label>Picture</label>

        <input
            id="photo"
            type="file"
            accept="image/*"
        >
    </div>


    <img
        id="preview"
        class="photo-preview"
        alt="Photo Preview"
        style="display:none;"
    >


    <div class="actions">

        <button
            id="saveBtn"
            class="primary"
            type="button"
        >
            SAVE PARTICIPANT
        </button>


        <button
            id="clearBtn"
            type="button"
        >
            CLEAR FORM
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        Ready.
    </div>

</form>


<!-- QR AREA -->

<div>

    <h2>QR Code</h2>

    <div
        id="qrBox"
        class="qr-box"
    >
        <canvas
            id="qrCanvas"
            width="260"
            height="260"
        ></canvas>
    </div>


    <p
        id="qrLabel"
        class="muted"
    >
        Save a participant to generate the QR.
    </p>


    <div class="actions">

        <button
            id="downloadQR"
            type="button"
        >
            DOWNLOAD QR
        </button>


        <button
            id="printQR"
            type="button"
        >
            PRINT QR
        </button>

    </div>

</div>

</section>


<section class="panel">

<h2>Participants</h2>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Photo</th>
<th>QR ID</th>
<th>Name</th>
<th>Position</th>
<th>Organization</th>
<th></th>
</tr>

</thead>

<tbody id="rows"></tbody>

</table>

</div>

</section>

</main>


<script src="config.js"></script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    window.SUPABASE_URL;

const SUPABASE_KEY =
    window.SUPABASE_PUBLISHABLE_KEY;


/* =====================================================
   ELEMENT HELPER
===================================================== */

function $(id) {
    return document.getElementById(id);
}


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentId = "";
let currentPhoto = "";


/* =====================================================
   STATUS MESSAGE
===================================================== */

function status(message, success = false) {

    const box = $("status");

    box.textContent = message;

    box.className =
        "status " +
        (success ? "success" : "error");
}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

$("photo").addEventListener(
    "change",
    function () {

        const file =
            this.files[0];

        if (!file) {
            $("preview").style.display =
                "none";

            return;
        }

        const url =
            URL.createObjectURL(file);

        $("preview").src = url;

        $("preview").style.display =
            "block";
    }
);


/* =====================================================
   UPLOAD PHOTO
===================================================== */

async function uploadPhoto(file, qr) {

    if (!file) {
        return "";
    }


    const extension =
        (
            file.name
            .split(".")
            .pop() ||
            "jpg"
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );


    const safeQR =
        qr
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const filename =
        safeQR +
        "-" +
        Date.now() +
        "." +
        extension;


    const url =
        SUPABASE_URL.replace(
            /\/$/,
            ""
        ) +
        "/storage/v1/object/participant-photos/" +
        encodeURIComponent(filename);


    status(
        "Uploading photo..."
    );


    let response;


    try {

        response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            file.type ||
                            "image/jpeg",

                        "x-upsert":
                            "false"

                    },

                    body: file
                }
            );

    }

    catch (error) {

        throw new Error(
            "Photo upload connection failed: " +
            error.message
        );

    }


    const text =
        await response.text();


    if (!response.ok) {

        let message =
            text;

        try {

            const json =
                JSON.parse(text);

            message =
                json.message ||
                json.error ||
                json.details ||
                text;

        }

        catch (e) {}

        throw new Error(
            "Storage error " +
            response.status +
            ": " +
            message
        );
    }


    /* PUBLIC PHOTO URL */

    const publicURL =
        SUPABASE_URL.replace(
            /\/$/,
            ""
        ) +
        "/storage/v1/object/public/participant-photos/" +
        encodeURIComponent(filename);


    return publicURL;
}


/* =====================================================
   SAVE PARTICIPANT
===================================================== */

async function saveParticipant() {

    console.log(
        "SAVE BUTTON CLICKED"
    );


    const qr =
        $("qr").value.trim();

    const name =
        $("name").value.trim();


    if (!qr) {

        status(
            "Please enter the QR / Participant ID."
        );

        $("qr").focus();

        return;
    }


    if (!name) {

        status(
            "Please enter the participant name."
        );

        $("name").focus();

        return;
    }


    const button =
        $("saveBtn");


    button.disabled =
        true;

    button.textContent =
        "SAVING...";


    try {

        /* -----------------------------------------
           PHOTO
        ----------------------------------------- */

        let photoURL =
            currentPhoto;


        const file =
            $("photo").files[0];


        if (file) {

            photoURL =
                await uploadPhoto(
                    file,
                    qr
                );

        }


        /* -----------------------------------------
           PARTICIPANT DATA
        ----------------------------------------- */

        status(
            "Saving participant information..."
        );


        const participant = {

            qr_code: qr,

            name: name,

            position:
                $("position")
                .value
                .trim(),

            organization:
                $("org")
                .value
                .trim(),

            message:
                $("message")
                .value
                .trim(),

            photo_url:
                photoURL || ""

        };


        /* -----------------------------------------
           SUPABASE DATABASE
        ----------------------------------------- */

        const databaseURL =
            SUPABASE_URL.replace(
                /\/$/,
                ""
            ) +
            "/rest/v1/participants" +
            "?on_conflict=qr_code";


        let response;


        try {

            response =
                await fetch(
                    databaseURL,
                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "resolution=merge-duplicates,return=minimal"

                        },

                        body:
                            JSON.stringify(
                                participant
                            )
                    }
                );

        }

        catch (error) {

            throw new Error(
                "Database connection failed: " +
                error.message
            );

        }


        const responseText =
            await response.text();


        if (!response.ok) {

            let errorMessage =
                responseText;

            try {

                const json =
                    JSON.parse(
                        responseText
                    );

                errorMessage =
                    json.message ||
                    json.details ||
                    json.hint ||
                    json.error ||
                    responseText;

            }

            catch (e) {}

            throw new Error(
                "Database error " +
                response.status +
                ": " +
                errorMessage
            );
        }


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        currentId =
            qr;

        currentPhoto =
            photoURL;


        status(
            "✅ PARTICIPANT SAVED SUCCESSFULLY!",
            true
        );


        /* -----------------------------------------
           GENERATE QR
        ----------------------------------------- */

        generateQR(qr);


        /* -----------------------------------------
           REFRESH PARTICIPANT LIST
        ----------------------------------------- */

        loadParticipants();


    }

    catch (error) {

        console.error(
            "SAVE ERROR:",
            error
        );


        status(
            "❌ " +
            error.message
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "SAVE PARTICIPANT";
    }

}


/* =====================================================
   GENERATE QR
===================================================== */

async function generateQR(value) {

    try {

        if (
            typeof QRCode ===
            "undefined"
        ) {

            throw new Error(
                "QR library did not load."
            );
        }


        await QRCode.toCanvas(
            $("qrCanvas"),
            value,
            {

                width: 260,

                margin: 2,

                errorCorrectionLevel:
                    "M"

            }
        );


        $("qrLabel").textContent =
            "QR ID: " +
            value;

    }

    catch (error) {

        console.error(
            "QR ERROR:",
            error
        );

    }

}


/* =====================================================
   CLEAR FORM
===================================================== */

$("clearBtn").addEventListener(
    "click",
    function () {

        $("participantForm").reset();

        $("message").value =
            "Welcome to the event!";

        $("preview").style.display =
            "none";

        $("preview").removeAttribute(
            "src"
        );

        currentId =
            "";

        currentPhoto =
            "";

        $("qrLabel").textContent =
            "Save a participant to generate the QR.";

        status(
            "Form cleared."
        );

    }
);


/* =====================================================
   DOWNLOAD QR
===================================================== */

$("downloadQR").addEventListener(
    "click",
    function () {

        if (!currentId) {

            alert(
                "Save a participant first."
            );

            return;
        }


        const link =
            document.createElement(
                "a"
            );


        link.download =
            currentId +
            ".png";


        link.href =
            $("qrCanvas")
            .toDataURL(
                "image/png"
            );


        link.click();

    }
);


/* =====================================================
   PRINT QR
===================================================== */

$("printQR").addEventListener(
    "click",
    function () {

        if (!currentId) {

            alert(
                "Save a participant first."
            );

            return;
        }


        const image =
            $("qrCanvas")
            .toDataURL(
                "image/png"
            );


        const printWindow =
            window.open(
                "",
                "_blank"
            );


        printWindow.document.write(`

            <html>

            <head>

            <title>
                ${currentId}
            </title>

            </head>

            <body
                style="
                text-align:center;
                font-family:Arial;
                "
            >

                <h2>
                    ${currentId}
                </h2>

                <img
                    src="${image}"
                    style="width:300px"
                >

                <p>
                    Scan ID:
                    ${currentId}
                </p>

            </body>

            </html>

        `);


        printWindow.document.close();

        printWindow.print();

    }
);


/* =====================================================
   LOAD PARTICIPANTS
===================================================== */

async function loadParticipants() {

    const url =
        SUPABASE_URL.replace(
            /\/$/,
            ""
        ) +
        "/rest/v1/participants" +
        "?select=*" +
        "&order=created_at.desc" +
        "&limit=100";


    try {

        const response =
            await fetch(
                url,
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const text =
            await response.text();


        if (!response.ok) {

            throw new Error(
                text
            );

        }


        const data =
            JSON.parse(text);


        const rows =
            $("rows");


        rows.innerHTML =
            "";


        if (
            !data ||
            data.length === 0
        ) {

            rows.innerHTML = `

                <tr>

                    <td colspan="6">

                        No participants yet.

                    </td>

                </tr>

            `;

            return;
        }


        data.forEach(
            function (p) {

                const tr =
                    document.createElement(
                        "tr"
                    );


                tr.innerHTML = `

                    <td>

                        ${
                            p.photo_url
                            ?
                            `<img
                                class="thumb"
                                src="${escapeHTML(p.photo_url)}"
                                alt=""
                            >`
                            :
                            "—"
                        }

                    </td>

                    <td>
                        ${escapeHTML(p.qr_code)}
                    </td>

                    <td>
                        ${escapeHTML(p.name)}
                    </td>

                    <td>
                        ${escapeHTML(p.position || "")}
                    </td>

                    <td>
                        ${escapeHTML(p.organization || "")}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="loadButton"
                            data-id="${escapeHTML(p.qr_code)}"
                        >
                            LOAD
                        </button>

                    </td>

                `;


                rows.appendChild(
                    tr
                );


                tr.querySelector(
                    ".loadButton"
                ).addEventListener(
                    "click",
                    function () {

                        loadParticipant(
                            p.qr_code
                        );

                    }
                );

            }
        );

    }

    catch (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        $("rows").innerHTML = `

            <tr>

                <td colspan="6">

                    Unable to load participants.

                </td>

            </tr>

        `;

    }

}


/* =====================================================
   LOAD ONE PARTICIPANT
===================================================== */

    const url =
        SUPABASE_URL.replace(
            /\/$/,
            ""
        ) +
        "/rest/v1/participants" +
        "?select=*" +
        "&qr_code=eq." +
        encodeURIComponent(id);


    try {

        const response =
            await fetch(
                url,
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.length
        ) {

            throw new Error(
                "Participant not found."
            );

        }


        const p =
            data[0];


        $("qr").value =
            p.qr_code || "";

        $("name").value =
            p.name || "";

        $("position").value =
