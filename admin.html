<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin — QR Event System</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: 0;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #475569;
    color: white;
}

.success {
    background: #16a34a;
    color: white;
}

.preview {
    margin-top: 15px;
    text-align: center;
}

.preview img {
    display: none;
    max-width: 220px;
    max-height: 220px;
    margin: auto;
    border-radius: 12px;
    object-fit: cover;
    border: 3px solid #e2e8f0;
}

#photoStatus {
    margin-top: 10px;
    color: #64748b;
    text-align: center;
}

.status {
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
    white-space: pre-wrap;
}

.status.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.qr-area {
    text-align: center;
    margin-top: 20px;
}

#qrcode {
    display: inline-block;
    padding: 15px;
    background: white;
    min-height: 30px;
}

.qr-id {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
    color: #2563eb;
}

.participant {
    padding: 15px;
    border-bottom: 1px solid #e2e8f0;
}

.participant:last-child {
    border-bottom: 0;
}

.participant strong {
    display: block;
    font-size: 18px;
}

.small {
    color: #64748b;
    font-size: 14px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="container">

    <!-- ================================
         ADMIN FORM
    ================================= -->

    <div class="card">

        <h1>QR Event System — Admin</h1>

        <p class="small">
            Register a participant and generate their QR code.
        </p>

        <form id="participantForm">

            <label for="qr_code">
                QR Code ID
            </label>

            <input
                id="qr_code"
                type="text"
                placeholder="Example: SM-2026-0001"
                required
            >

            <label for="name">
                Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Participant name"
                required
            >

            <label for="position">
                Position
            </label>

            <input
                id="position"
                type="text"
                placeholder="Mayor / Guest / Participant"
            >

            <label for="organization">
                Organization
            </label>

            <input
                id="organization"
                type="text"
                placeholder="Organization"
            >

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                placeholder="Welcome message..."
            ></textarea>

            <label for="photo">
                Participant Photo
            </label>

            <input
                id="photo"
                type="file"
                accept="image/*"
            >

            <div id="photoStatus">
                No photo selected.
            </div>

            <div class="preview">

                <img
                    id="photoPreview"
                    alt="Photo Preview"
                >

            </div>

            <div class="actions">

                <button
                    id="saveBtn"
                    class="primary"
                    type="submit"
                >
                    SAVE PARTICIPANT
                </button>

                <button
                    id="clearBtn"
                    class="secondary"
                    type="button"
                >
                    CLEAR
                </button>

            </div>

        </form>

        <div
            id="status"
            class="status"
        ></div>

    </div>


    <!-- ================================
         QR CODE
    ================================= -->

    <div class="card">

        <h2>Participant QR Code</h2>

        <div class="qr-area">

            <div id="qrcode"></div>

            <div
                id="qrIdDisplay"
                class="qr-id"
            >
                No QR generated
            </div>

            <br>

            <button
                id="downloadQR"
                class="success"
                type="button"
                disabled
            >
                DOWNLOAD QR
            </button>

        </div>

    </div>


    <!-- ================================
         PARTICIPANT LIST
    ================================= -->

    <div class="card">

        <h2>Registered Participants</h2>

        <div id="participants">
            Loading...
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://bduudxtfqyswgwimvzpr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop";

const BUCKET =
    "participant-photos";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById(
        "participantForm"
    );

const saveBtn =
    document.getElementById(
        "saveBtn"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const photoInput =
    document.getElementById(
        "photo"
    );

const photoPreview =
    document.getElementById(
        "photoPreview"
    );

const photoStatus =
    document.getElementById(
        "photoStatus"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const qrContainer =
    document.getElementById(
        "qrcode"
    );

const qrIdDisplay =
    document.getElementById(
        "qrIdDisplay"
    );

const downloadQR =
    document.getElementById(
        "downloadQR"
    );

const participantsBox =
    document.getElementById(
        "participants"
    );


/* =========================================================
   PHOTO PREVIEW
========================================================= */

photoInput.addEventListener(
    "change",
    function () {

        const file =
            this.files &&
            this.files[0];


        if (!file) {

            photoPreview.style.display =
                "none";

            photoPreview.removeAttribute(
                "src"
            );

            photoStatus.textContent =
                "No photo selected.";

            return;
        }


        if (!file.type.startsWith("image/")) {

            photoPreview.style.display =
                "none";

            photoStatus.textContent =
                "Please select an image file.";

            this.value = "";

            return;
        }


        photoStatus.textContent =
            "Loading photo...";


        const reader =
            new FileReader();


        reader.onload =
            function (event) {

                photoPreview.src =
                    event.target.result;

                photoPreview.style.display =
                    "block";

                photoStatus.textContent =
                    file.name +
                    " (" +
                    Math.round(
                        file.size / 1024
                    ) +
                    " KB)";
            };


        reader.onerror =
            function () {

                photoPreview.style.display =
                    "none";

                photoStatus.textContent =
                    "Unable to preview this photo.";
            };


        reader.readAsDataURL(file);

    }
);


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    }
    catch {

        data = text;

    }


    if (!response.ok) {

        let errorMessage =
            "HTTP " +
            response.status;


        if (data) {

            if (data.message) {

                errorMessage +=
                    "\n" +
                    data.message;

            }

            else if (data.error) {

                errorMessage +=
                    "\n" +
                    data.error;

            }

            else {

                errorMessage +=
                    "\n" +
                    JSON.stringify(data);

            }

        }


        throw new Error(
            errorMessage
        );
    }


    return data;

}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(
    file,
    qrCode
) {

    if (!file)
        return "";


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const filename =
        qrCode +
        "-" +
        Date.now() +
        "." +
        extension;


    const response =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET +
            "/" +
            encodeURIComponent(
                filename
            ),

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        file.type ||
                        "application/octet-stream",

                    "x-upsert":
                        "true"

                },

                body: file

            }

        );


    const text =
        await response.text();


    if (!response.ok) {

        throw new Error(

            "Photo upload failed.\n" +

            "HTTP " +
            response.status +

            "\n" +

            text

        );

    }


    return (

        SUPABASE_URL +

        "/storage/v1/object/public/" +

        BUCKET +

        "/" +

        encodeURIComponent(
            filename
        )

    );

}


/* =========================================================
   GENERATE QR CODE
========================================================= */

function generateQR(
    participantID
) {

    const value =
        String(
            participantID
        ).trim();


    /* Clear old QR */

    qrContainer.innerHTML =
        "";


    qrIdDisplay.textContent =
        "QR ID: " +
        value;


    /*
       IMPORTANT:

       The QR contains ONLY the participant ID.

       Example:

       SM-2026-0001
    */

    new QRCode(

        qrContainer,

        {

            text: value,

            width: 250,

            height: 250,

            colorDark: "#000000",

            colorLight: "#ffffff",

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );


    downloadQR.disabled =
        false;


    /* Store current ID */

    downloadQR.dataset.qr =
        value;

}


/* =========================================================
   SAVE PARTICIPANT
========================================================= */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        saveBtn.disabled =
            true;

        saveBtn.textContent =
            "SAVING...";


        try {

            const qrCode =
                document
                    .getElementById(
                        "qr_code"
                    )
                    .value
                    .trim();


            const name =
                document
                    .getElementById(
                        "name"
                    )
                    .value
                    .trim();


            const position =
                document
                    .getElementById(
                        "position"
                    )
                    .value
                    .trim();


            const organization =
                document
                    .getElementById(
                        "organization"
                    )
                    .value
                    .trim();


            const message =
                document
                    .getElementById(
                        "message"
                    )
                    .value
                    .trim();


            const photo =
                photoInput.files &&
                photoInput.files[0];


            /* -----------------------------------------
               VALIDATION
            ----------------------------------------- */

            if (!qrCode) {

                throw new Error(
                    "QR Code ID is required."
                );

            }


            if (!name) {

                throw new Error(
                    "Participant name is required."
                );

            }


            /* -----------------------------------------
               STATUS
            ----------------------------------------- */

            showStatus(
                "Checking database...",
                "success"
            );


            /* -----------------------------------------
               CHECK DATABASE CONNECTION
            ----------------------------------------- */

            await supabaseRequest(

                "/rest/v1/participants" +
                "?select=id" +
                "&qr_code=eq." +
                encodeURIComponent(
                    qrCode
                )

            );


            /* -----------------------------------------
               UPLOAD PHOTO
            ----------------------------------------- */

            let photoURL = "";


            if (photo) {

                showStatus(
                    "Uploading participant photo...",
                    "success"
                );


                photoURL =
                    await uploadPhoto(
                        photo,
                        qrCode
                    );

            }


            /* -----------------------------------------
               PARTICIPANT DATA
            ----------------------------------------- */

            const participant = {

                qr_code:
                    qrCode,

                name:
                    name,

                position:
                    position,

                organization:
                    organization,

                message:
                    message,

                photo_url:
                    photoURL,

                updated_at:
                    new Date().toISOString()

            };


            /* -----------------------------------------
               SAVE TO SUPABASE
            ----------------------------------------- */

            showStatus(
                "Saving participant information...",
                "success"
            );


            await supabaseRequest(

                "/rest/v1/participants" +
                "?on_conflict=qr_code",

                {

                    method:
                        "POST",

                    headers: {

                        "Prefer":
                            "resolution=merge-duplicates,return=representation"

                    },

                    body:
                        JSON.stringify(
                            participant
                        )

                }

            );


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            /*
               QR IS GENERATED HERE,
               ONLY AFTER SUPABASE SUCCESSFULLY
               SAVED THE PARTICIPANT.
            */

            generateQR(
                qrCode
            );


            showStatus(

                "PARTICIPANT SAVED SUCCESSFULLY!\n\n" +

                "Name: " +
                name +

                "\nQR ID: " +
                qrCode +

                "\n\nThe QR code on the right has been updated."

                ,

                "success"

            );


            /* -----------------------------------------
               REFRESH PARTICIPANT LIST
            ----------------------------------------- */

            await loadParticipants();


        }

        catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            showStatus(

                "SAVE FAILED\n\n" +

                error.message,

                "error"

            );

        }


        finally {

            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "SAVE PARTICIPANT";

        }

    }
);


/* =========================================================
   DOWNLOAD QR
========================================================= */

downloadQR.addEventListener(
    "click",
    function () {

        const canvas =
            qrContainer.querySelector(
                "canvas"
            );

        const img =
            qrContainer.querySelector(
                "img"
            );


        let url = "";


        if (canvas) {

            url =
                canvas.toDataURL(
                    "image/png"
                );

        }

        else if (img) {

            url =
                img.src;

        }


        if (!url) {

            alert(
                "No QR code available."
            );

            return;

        }


        const qrID =
            this.dataset.qr ||
            "participant";


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            qrID +
            "-QR.png";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }
);


/* =========================================================
   CLEAR FORM
========================================================= */

clearBtn.addEventListener(
    "click",
    function () {

        form.reset();


        photoPreview.style.display =
            "none";


        photoPreview.removeAttribute(
            "src"
        );


        photoStatus.textContent =
            "No photo selected.";


        statusBox.style.display =
            "none";


        /*
           Clear QR too when CLEAR is pressed.
        */

        qrContainer.innerHTML =
            "";


        qrIdDisplay.textContent =
            "No QR generated";


        downloadQR.disabled =
            true;


        delete downloadQR.dataset.qr;

    }
);


/* =========================================================
   LOAD PARTICIPANTS
========================================================= */

async function loadParticipants() {

    try {

        const data =
            await supabaseRequest(

                "/rest/v1/participants" +
                "?select=*" +
                "&order=created_at.desc"

            );


        participantsBox.innerHTML =
            "";


        if (
            !data ||
            data.length === 0
        ) {

            participantsBox.innerHTML =
                '<p class="small">' +
                'No participants registered yet.' +
                '</p>';

            return;

        }


        data.forEach(
            function (participant) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "participant";


                div.innerHTML =

                    "<strong>" +

                    escapeHTML(
                        participant.name
                    ) +

                    "</strong>" +

                    '<span class="small">' +

                    "QR ID: " +

                    escapeHTML(
                        participant.qr_code
                    ) +

                    "</span><br>" +

                    '<span class="small">' +

                    escapeHTML(
                        participant.position ||
                        ""
                    ) +

                    (
                        participant.organization
                            ? " • " +
                              escapeHTML(
                                  participant.organization
                              )
                            : ""
                    ) +

                    "</span>";


                participantsBox.appendChild(
                    div
                );

            }
        );

    }

    catch (error) {

        participantsBox.innerHTML =

            '<p style="color:#dc2626">' +

            "Could not load participants: " +

            escapeHTML(
                error.message
            ) +

            "</p>";

    }

}


/* =========================================================
   STATUS MESSAGE
========================================================= */

function showStatus(
    message,
    type
) {

    statusBox.className =
        "status " +
        type;


    statusBox.textContent =
        message;


    statusBox.style.display =
        "block";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadParticipants();

</script>

</body>
</html>
