<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin — QR Event System</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#0f172a;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#475569;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.preview{
    margin-top:15px;
    text-align:center;
}

.preview img{
    display:none;
    max-width:220px;
    max-height:220px;
    margin:auto;
    border-radius:12px;
    object-fit:cover;
    border:3px solid #e2e8f0;
}

#photoStatus{
    margin-top:10px;
    color:#64748b;
}

.status{
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    display:none;
    white-space:pre-wrap;
}

.status.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.status.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.qr-area{
    text-align:center;
    margin-top:20px;
}

#qrcode{
    display:inline-block;
    padding:15px;
    background:white;
}

.participant{
    padding:15px;
    border-bottom:1px solid #e2e8f0;
}

.participant:last-child{
    border-bottom:0;
}

.participant strong{
    display:block;
    font-size:18px;
}

.small{
    color:#64748b;
    font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>QR Event System — Admin</h1>

<p class="small">
Register a participant and generate their QR code.
</p>

<form id="participantForm">

<label>QR Code ID</label>

<input
    id="qr_code"
    type="text"
    placeholder="Example: SM-2026-0001"
    required
>

<label>Name</label>

<input
    id="name"
    type="text"
    placeholder="Participant name"
    required
>

<label>Position</label>

<input
    id="position"
    type="text"
    placeholder="Mayor / Guest / Participant"
>

<label>Organization</label>

<input
    id="organization"
    type="text"
    placeholder="Organization"
>

<label>Message</label>

<textarea
    id="message"
    placeholder="Welcome message..."
></textarea>

<label>Participant Photo</label>

<input
    id="photo"
    type="file"
    accept="image/*"
>

<div id="photoStatus">
No photo selected.
</div>

<div class="preview">

<img id="photoPreview" alt="Photo Preview">

</div>

<br>

<button
    id="saveBtn"
    class="primary"
    type="submit"
>
SAVE PARTICIPANT
</button>

<button
    id="clearBtn"
    class="secondary"
    type="button"
>
CLEAR
</button>

</form>

<div id="status" class="status"></div>

</div>


<div class="card">

<h2>Generated QR Code</h2>

<div class="qr-area">

<div id="qrcode"></div>

<br><br>

<button
    id="downloadQR"
    class="success"
    type="button"
    disabled
>
DOWNLOAD QR
</button>

</div>

</div>


<div class="card">

<h2>Registered Participants</h2>

<div id="participants">
Loading...
</div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://bduudxtfqyswgwimvzpr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop";

const BUCKET =
"participant-photos";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
document.getElementById("participantForm");

const saveBtn =
document.getElementById("saveBtn");

const clearBtn =
document.getElementById("clearBtn");

const photoInput =
document.getElementById("photo");

const photoPreview =
document.getElementById("photoPreview");

const photoStatus =
document.getElementById("photoStatus");

const statusBox =
document.getElementById("status");

const qrContainer =
document.getElementById("qrcode");

const downloadQR =
document.getElementById("downloadQR");

const participantsBox =
document.getElementById("participants");


let currentQR = null;


/* =========================================================
   STATUS
========================================================= */

function showStatus(message,type){

    statusBox.className =
        "status " + type;

    statusBox.textContent =
        message;

    statusBox.style.display =
        "block";
}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

photoInput.addEventListener("change",function(){

    const file =
        this.files && this.files[0];

    if(!file){

        photoPreview.style.display =
            "none";

        photoPreview.removeAttribute("src");

        photoStatus.textContent =
            "No photo selected.";

        return;
    }


    if(!file.type.startsWith("image/")){

        photoPreview.style.display =
            "none";

        photoStatus.textContent =
            "Please select an image file.";

        this.value = "";

        return;
    }


    photoStatus.textContent =
        "Loading photo...";


    const reader =
        new FileReader();


    reader.onload = function(event){

        photoPreview.src =
            event.target.result;

        photoPreview.style.display =
            "block";

        photoStatus.textContent =
            file.name +
            " (" +
            Math.round(file.size / 1024) +
            " KB)";
    };


    reader.onerror = function(){

        photoPreview.style.display =
            "none";

        photoStatus.textContent =
            "Unable to preview this photo.";
    };


    reader.readAsDataURL(file);

});


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
    endpoint,
    options={}
){

    const response =
        await fetch(
            SUPABASE_URL +
            endpoint,
            {
                ...options,

                headers:{
                    "apikey":SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;

    try{
        data =
            text ? JSON.parse(text) : null;
    }
    catch{
        data = text;
    }


    if(!response.ok){

        let message =
            "HTTP " +
            response.status;


        if(data){

            if(data.message)
                message +=
                    "\n" + data.message;

            else if(data.error)
                message +=
                    "\n" + data.error;

            else
                message +=
                    "\n" +
                    JSON.stringify(data);
        }


        throw new Error(message);
    }


    return data;
}


/* =========================================================
   UPLOAD PHOTO
========================================================= */

async function uploadPhoto(file,qrCode){

    if(!file)
        return "";


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const filename =
        qrCode +
        "-" +
        Date.now() +
        "." +
        extension;


    const path =
        filename;


    const response =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/" +
            BUCKET +
            "/" +
            encodeURIComponent(path),

            {
                method:"POST",

                headers:{
                    "apikey":SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        file.type ||
                        "application/octet-stream",

                    "x-upsert":
                        "true"
                },

                body:file
            }

        );


    const text =
        await response.text();


    if(!response.ok){

        throw new Error(
            "Photo upload failed.\n" +
            "HTTP " +
            response.status +
            "\n" +
            text
        );
    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUCKET +
        "/" +
        encodeURIComponent(path)
    );
}


/* =========================================================
   SAVE PARTICIPANT
========================================================= */

form.addEventListener(
"submit",
async function(event){

    event.preventDefault();


    saveBtn.disabled =
        true;

    saveBtn.textContent =
        "SAVING...";


    try{

        const qrCode =
            document
            .getElementById("qr_code")
            .value
            .trim();

        const name =
            document
            .getElementById("name")
            .value
            .trim();

        const position =
            document
            .getElementById("position")
            .value
            .trim();

        const organization =
            document
            .getElementById("organization")
            .value
            .trim();

        const message =
            document
            .getElementById("message")
            .value
            .trim();

        const photo =
            photoInput.files &&
            photoInput.files[0];


        if(!qrCode){

            throw new Error(
                "QR Code ID is required."
            );
        }


        if(!name){

            throw new Error(
                "Participant name is required."
            );
        }


        showStatus(
            "Checking Supabase database...",
            "success"
        );


        /* -------------------------------------------------
           CHECK DATABASE
        ------------------------------------------------- */

        await supabaseRequest(
            "/rest/v1/participants" +
            "?select=id" +
            "&qr_code=eq." +
            encodeURIComponent(qrCode)
        );


        /* -------------------------------------------------
           PHOTO
        ------------------------------------------------- */

        let photoURL = "";


        if(photo){

            showStatus(
                "Uploading participant photo...",
                "success"
            );


            photoURL =
                await uploadPhoto(
                    photo,
                    qrCode
                );
        }


        /* -------------------------------------------------
           UPSERT PARTICIPANT
        ------------------------------------------------- */

        showStatus(
            "Saving participant information...",
            "success"
        );


        const participant = {

            qr_code:qrCode,

            name:name,

            position:position,

            organization:organization,

            message:message,

            photo_url:photoURL,

            updated_at:
                new Date().toISOString()
        };


        const saved =
            await supabaseRequest(

                "/rest/v1/participants" +
                "?on_conflict=qr_code",

                {
                    method:"POST",

                    headers:{
                        "Prefer":
                            "resolution=merge-duplicates,return=representation"
                    },

                    body:
                        JSON.stringify(
                            participant
                        )
                }

            );


        /* -------------------------------------------------
           GENERATE QR
        ------------------------------------------------- */

        generateQR(qrCode);


        showStatus(
            "PARTICIPANT SAVED SUCCESSFULLY!\n\n" +
            "Name: " +
            name +
            "\nQR ID: " +
            qrCode,
            "success"
        );


        await loadParticipants();


    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showStatus(
            "SAVE FAILED\n\n" +
            error.message +
            "\n\nOpen Chrome Console (F12) if you need the technical error.",
            "error"
        );


    }
    finally{

        saveBtn.disabled =
            false;

        saveBtn.textContent =
            "SAVE PARTICIPANT";

    }

});


/* =========================================================
   GENERATE QR
========================================================= */

function generateQR(value){

    qrContainer.innerHTML = "";


    currentQR =
        new QRCode(
            qrContainer,
            {
                text:value,

                width:250,

                height:250,

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


    downloadQR.disabled =
        false;
}


/* =========================================================
   DOWNLOAD QR
========================================================= */

downloadQR.addEventListener(
"click",
function(){

    const img =
        qrContainer.querySelector("img");

    const canvas =
        qrContainer.querySelector("canvas");


    let url = "";


    if(canvas){

        url =
            canvas.toDataURL(
                "image/png"
            );

    }
    else if(img){

        url =
            img.src;

    }


    if(!url)
        return;


    const a =
        document.createElement("a");

    a.href =
        url;

    a.download =
        "participant-qr.png";

    document.body.appendChild(a);

    a.click();

    a.remove();

});


/* =========================================================
   CLEAR FORM
========================================================= */

clearBtn.addEventListener(
"click",
function(){

    form.reset();


    photoPreview.style.display =
        "none";

    photoPreview.removeAttribute(
        "src"
    );


    photoStatus.textContent =
        "No photo selected.";


    qrContainer.innerHTML =
        "";


    downloadQR.disabled =
        true;


    statusBox.style.display =
        "none";

});


/* =========================================================
   LOAD PARTICIPANTS
========================================================= */

async function loadParticipants(){

    try{

        const data =
            await supabaseRequest(

                "/rest/v1/participants" +
                "?select=*" +
                "&order=created_at.desc"

            );


        participantsBox.innerHTML =
            "";


        if(!data ||
           data.length === 0){

            participantsBox.innerHTML =
                '<p class="small">No participants registered yet.</p>';

            return;
        }


        data.forEach(
            function(p){

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "participant";


                div.innerHTML =

                    "<strong>" +
                    escapeHTML(p.name) +
                    "</strong>" +

                    '<span class="small">' +
                    escapeHTML(
                        p.qr_code
                    ) +
                    "</span><br>" +

                    '<span class="small">' +
                    escapeHTML(
                        p.position || ""
                    ) +
                    (
                        p.organization
                        ?
                        " • " +
                        escapeHTML(
                            p.organization
                        )
                        :
                        ""
                    ) +
                    "</span>";



                participantsBox.appendChild(
                    div
                );

            }
        );


    }
    catch(error){

        participantsBox.innerHTML =
            '<p style="color:#dc2626">' +
            "Could not load participants: " +
            escapeHTML(
                error.message
            ) +
            "</p>";

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   START
========================================================= */

loadParticipants();

</script>

</body>
</html>
