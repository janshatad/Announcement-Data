<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LED Event Display</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.welcome{font-size:clamp(42px,7vw,110px);font-weight:800;letter-spacing:.04em}.card{width:min(92vw,1400px);display:grid;grid-template-columns:minmax(260px,42%) 1fr;gap:clamp(25px,5vw,80px);align-items:center}.photo{width:min(38vw,520px);height:min(58vh,620px);object-fit:cover;border-radius:30px;background:#111;box-shadow:0 0 50px #222}.info{text-align:left}.name{font-size:clamp(42px,6vw,100px);font-weight:900;line-height:1.05}.position{font-size:clamp(24px,3vw,50px);margin-top:18px;opacity:.9}.org{font-size:clamp(20px,2.2vw,36px);margin-top:12px;opacity:.75}.message{font-size:clamp(22px,2.5vw,40px);margin-top:35px;line-height:1.35;opacity:.95}.hidden{display:none!important}
#setup{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:99;display:flex;align-items:center;justify-content:center;padding:25px}.panel{width:min(680px,95vw);background:#101010;border:1px solid #333;border-radius:24px;padding:28px;box-shadow:0 25px 80px #000}.panel h1{margin:0 0 8px;font-size:30px}.panel p{color:#aaa;margin:0 0 22px}.row{margin:14px 0}.row label{display:block;font-size:14px;color:#bbb;margin-bottom:7px}.row select,.row input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#181818;color:#fff}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#252525;color:#fff}.status{font-size:13px;color:#999;margin-top:15px;min-height:18px}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:15px}.check{display:flex;align-items:center;gap:10px;margin-top:12px;color:#ccc}.check input{width:auto}#error{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#600;padding:10px 16px;border-radius:9px;display:none;z-index:120;max-width:90vw;text-align:center}
@media(max-width:800px){.card{grid-template-columns:1fr;text-align:center}.photo{width:55vw;height:35vh;margin:auto}.info{text-align:center}.message{margin-top:20px}}
</style>
</head>
<body>
<div id="setup"><div class="panel">
<h1>LED Wall Voice Setup</h1><p>Choose your ElevenLabs voice before starting the immersive LED display.</p>
<div class="row"><label>ElevenLabs Voice</label><select id="voice"></select></div>
<div class="sliders"><div class="row"><label>Stability <span id="stabilityVal">0.50</span></label><input id="stability" type="range" min="0" max="1" step="0.01" value="0.50"></div><div class="row"><label>Similarity <span id="similarityVal">0.75</span></label><input id="similarity" type="range" min="0" max="1" step="0.01" value="0.75"></div></div>
<div class="row"><label>Speed <span id="speedVal">1.00</span></label><input id="speed" type="range" min="0.7" max="1.2" step="0.01" value="1"></div>
<label class="check"><input id="autoTts" type="checkbox" checked> Automatically announce each scanned participant</label>
<div class="buttons"><button class="btn secondary" id="test">TEST VOICE</button><button class="btn primary" id="start">START LED DISPLAY</button></div>
<div class="status" id="status">Loading ElevenLabs voices…</div>
</div></div>
<div class="screen"><div id="welcome" class="welcome">READY TO SCAN</div><div id="card" class="card hidden"><img id="photo" class="photo" alt="Participant"><div class="info"><div id="name" class="name"></div><div id="position" class="position"></div><div id="org" class="org"></div><div id="message" class="message"></div></div></div></div>
<div id="error"></div>
<script>
const SUPABASE_URL='https://bduudxtfqyswgwimvzpr.supabase.co';
const SUPABASE_KEY='sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop';
const TTS_URL=SUPABASE_URL+'/functions/v1/eleven-tts';
const $=id=>document.getElementById(id);
let voices=[],selectedVoice='',lastScanId=0,audio=null,started=false,pollTimer=null;
const settings={stability:.5,similarity:.75,speed:1,autoTts:true};
const headers=()=>({'apikey':SUPABASE_KEY,'Content-Type':'application/json'});
function showError(msg){$('error').textContent=msg;$('error').style.display='block';setTimeout(()=>$('error').style.display='none',6000)}
function voiceLabel(v){const labels=v.labels||{};const parts=[];if(labels.accent)parts.push(labels.accent);if(labels.gender)parts.push(labels.gender);if(labels.age)parts.push(labels.age);return `${v.name}${parts.length?' — '+parts.join(' · '):''}`}
function score(v){const s=((v.name||'')+' '+JSON.stringify(v.labels||{})).toLowerCase();let n=0;if(/neural|natural|multilingual|professional|premade/.test(s))n+=20;if(/jenny|aria|emma|brian|roger|andrew|ava|nova|rosa|james/.test(s))n+=10;if(/en-ph|philippine/.test(s))n+=15;return n}
async function loadVoices(){try{const r=await fetch(TTS_URL);const d=await r.json();if(!r.ok)throw Error(d.error||d.details||'Voice loading failed');voices=(d.voices||[]).sort((a,b)=>score(b)-score(a)||a.name.localeCompare(b.name));$('voice').innerHTML=voices.map(v=>`<option value="${v.voice_id}">${voiceLabel(v)}</option>`).join('');const saved=localStorage.getItem('eleven_voice_id');if(saved&&voices.some(v=>v.voice_id===saved))$('voice').value=saved;selectedVoice=$('voice').value;if(selectedVoice)localStorage.setItem('eleven_voice_id',selectedVoice);$('status').textContent=`${voices.length} ElevenLabs voices available.`;if(!voices.length)throw Error('No ElevenLabs voices were returned.');}catch(e){$('status').textContent='Could not load ElevenLabs voices.';showError(e.message)}}
async function synthesize(text){if(!selectedVoice)throw Error('Please select an ElevenLabs voice.');if(audio){audio.pause();if(audio.src)URL.revokeObjectURL(audio.src);audio=null}const r=await fetch(TTS_URL,{method:'POST',headers:headers(),body:JSON.stringify({text,voice_id:selectedVoice,model_id:'eleven_multilingual_v2',stability:+$('stability').value,similarity_boost:+$('similarity').value,speed:+$('speed').value})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||d.details||`ElevenLabs TTS failed (${r.status})`)}const blob=await r.blob();audio=new Audio(URL.createObjectURL(blob));audio.preload='auto';await audio.play()}
function participantText(p){const bits=[`Welcome ${p.name}.`];if(p.position)bits.push(`${p.position}.`);if(p.organization)bits.push(`From ${p.organization}.`);if(p.message)bits.push(p.message);return bits.join(' ').replace(/\s+/g,' ').trim()}
function render(p){$('welcome').classList.add('hidden');$('card').classList.remove('hidden');$('name').textContent=p.name||'';$('position').textContent=p.position||'';$('org').textContent=p.organization||'';$('message').textContent=p.message||'';if(p.photo_url){$('photo').src=p.photo_url;$('photo').style.display='block'}else $('photo').style.display='none'}
async function poll(){if(!started)return;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/scan_history?select=id,participant_id&order=id.desc&limit=1`,{headers:headers()});if(!r.ok)return;const rows=await r.json();if(!rows.length||rows[0].id===lastScanId)return;lastScanId=rows[0].id;const pr=await fetch(`${SUPABASE_URL}/rest/v1/participants?id=eq.${encodeURIComponent(rows[0].participant_id)}&select=*`,{headers:headers()});if(!pr.ok)return;const ps=await pr.json();if(!ps.length)return;const p=ps[0];render(p);if(settings.autoTts){try{await synthesize(participantText(p))}catch(e){showError(e.message)}}}catch(e){}}
$('voice').addEventListener('change',()=>{selectedVoice=$('voice').value;localStorage.setItem('eleven_voice_id',selectedVoice)});
['stability','similarity','speed'].forEach(id=>$(id).addEventListener('input',()=>$(id+'Val').textContent=(+$(id).value).toFixed(2)));
$('autoTts').addEventListener('change',()=>settings.autoTts=$('autoTts').checked);
$('test').onclick=async()=>{try{selectedVoice=$('voice').value;settings.stability=+$('stability').value;settings.similarity=+$('similarity').value;settings.speed=+$('speed').value;await synthesize('Hello. This is the ElevenLabs voice test for the LED event display.');}catch(e){showError(e.message)}};
$('start').onclick=async()=>{try{selectedVoice=$('voice').value;settings.autoTts=$('autoTts').checked;await synthesize('LED wall is ready. Please scan the participant QR code.');started=true;$('setup').classList.add('hidden');if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen().catch(()=>{});await poll();pollTimer=setInterval(poll,1200);}catch(e){showError(e.message)}};
loadVoices();
</script>
</body></html>
