<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LED Wall Display</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body{

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ==========================================
   MAIN SCREEN
========================================== */

.screen{

    width:100vw;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    position:relative;

    overflow:hidden;

    background:

        radial-gradient(
            circle at center,
            #172554 0%,
            #020617 55%,
            #000000 100%
        );

}


/* ==========================================
   BACKGROUND LIGHT
========================================== */

.screen::before{

    content:"";

    position:absolute;

    width:75vmax;

    height:75vmax;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(37,99,235,.30),
            transparent 65%
        );

    filter:blur(35px);

    animation:
        pulse 6s ease-in-out infinite;

}


@keyframes pulse{

    0%,
    100%{

        transform:scale(.9);

        opacity:.5;

    }

    50%{

        transform:scale(1.1);

        opacity:.9;

    }

}


/* ==========================================
   CONTENT
========================================== */

.content{

    position:relative;

    z-index:2;

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        4vh
        5vw;

}


/* ==========================================
   WELCOME
========================================== */

.welcome{

    font-size:
        clamp(
            28px,
            4vw,
            80px
        );

    font-weight:900;

    letter-spacing:
        clamp(
            2px,
            .5vw,
            8px
        );

    margin-bottom:2vh;

    text-shadow:

        0 0 15px
        rgba(255,255,255,.5),

        0 0 35px
        rgba(37,99,235,.8);

}


/* ==========================================
   PHOTO
========================================== */

.photo{

    width:
        clamp(
            170px,
            25vh,
            430px
        );

    height:
        clamp(
            170px,
            25vh,
            430px
        );

    border-radius:50%;

    object-fit:cover;

    border:
        clamp(
            4px,
            .5vw,
            10px
        )
        solid
        #fff;

    box-shadow:

        0 0 25px
        rgba(255,255,255,.35),

        0 0 60px
        rgba(37,99,235,.85);

    background:#1e293b;

    margin-bottom:2vh;

}


/* ==========================================
   NAME
========================================== */

.name{

    font-size:
        clamp(
            34px,
            6vw,
            110px
        );

    font-weight:900;

    line-height:1.05;

    max-width:95vw;

    word-wrap:break-word;

    text-transform:uppercase;

    text-shadow:

        0 0 12px
        rgba(255,255,255,.6),

        0 0 35px
        rgba(37,99,235,.9);

}


/* ==========================================
   INFO
========================================== */

.info{

    font-size:
        clamp(
            20px,
            3vw,
            55px
        );

    font-weight:600;

    margin-top:1.5vh;

    max-width:90vw;

    line-height:1.2;

}


/* ==========================================
   MESSAGE
========================================== */

.message{

    font-size:
        clamp(
            18px,
            2.3vw,
            42px
        );

    max-width:85vw;

    line-height:1.3;

    margin-top:2vh;

}


/* ==========================================
   FOOTER
========================================== */

.footer{

    position:absolute;

    bottom:1.5vh;

    left:0;

    width:100%;

    font-size:
        clamp(
            9px,
            1vw,
            18px
        );

    letter-spacing:3px;

    opacity:.35;

}

</style>

</head>


<body>


<main class="screen">

<div class="content">


<div class="welcome">

WELCOME

</div>


<img
    id="photo"
    class="photo"
    alt=""
>


<div
    id="name"
    class="name"
>

READY TO SCAN

</div>


<div
    id="info"
    class="info"
>

Waiting for the next QR scan...

</div>


<div
    id="message"
    class="message"
></div>


<div class="footer">

QR EVENT INFORMATION SYSTEM

</div>


</div>

</main>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://bduudxtfqyswgwimvzpr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop";


const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let lastScanId = null;

let ttsSettings = {

    enabled:true,

    voice:"",

    rate:1,

    pitch:1,

    volume:1

};

let voices = [];


/* =====================================================
   LOAD VOICES
===================================================== */

function loadVoices(){

    if(
        !("speechSynthesis" in window)
    )
        return;


    voices =
        speechSynthesis
            .getVoices() || [];

}


if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();

}


/* =====================================================
   LOAD TTS SETTINGS
===================================================== */

async function loadTTSSettings(){

    try{

        const result =
            await db
                .from("system_settings")
                .select("*")
                .eq("id",1)
                .maybeSingle();


        if(
            result.error
        ){

            console.warn(
                "TTS settings unavailable:",
                result.error
            );

            return;

        }


        const data =
            result.data;


        if(!data)
            return;


        ttsSettings = {

            enabled:
                data.tts_enabled !== false,

            voice:
                data.tts_voice || "",

            rate:
                Number(
                    data.tts_rate
                ) || 1,

            pitch:
                Number(
                    data.tts_pitch
                ) || 1,

            volume:
                Number(
                    data.tts_volume
                ) ?? 1

        };


    }

    catch(error){

        console.error(
            "TTS settings error:",
            error
        );

    }

}


/* =====================================================
   SPEAK
===================================================== */

function speakParticipant(
    participant
){

    if(
        !ttsSettings.enabled
    )
        return;


    if(
        !("speechSynthesis" in window)
    )
        return;


    let text =
        "Now welcoming " +
        (
            participant.name ||
            "participant"
        ) +
        ".";


    if(
        participant.position
    ){

        text +=
            " " +
            participant.position +
            ".";

    }


    if(
        participant.organization
    ){

        text +=
            " From " +
            participant.organization +
            ".";

    }


    if(
        participant.message
    ){

        text +=
            " " +
            participant.message;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    const voice =
        voices.find(
            function(v){

                return (
                    v.name ===
                    ttsSettings.voice
                );

            }
        );


    if(voice){

        utterance.voice =
            voice;

    }


    utterance.rate =
        ttsSettings.rate;

    utterance.pitch =
        ttsSettings.pitch;

    utterance.volume =
        ttsSettings.volume;


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   DISPLAY PARTICIPANT
===================================================== */

function displayParticipant(
    participant
){

    console.log(
        "DISPLAY PARTICIPANT:",
        participant
    );


    const photo =
        document.getElementById(
            "photo"
        );


    const name =
        document.getElementById(
            "name"
        );


    const info =
        document.getElementById(
            "info"
        );


    const message =
        document.getElementById(
            "message"
        );


    /* PHOTO */

    if(
        participant.photo_url
    ){

        photo.src =
            participant.photo_url;

    }

    else{

        photo.removeAttribute(
            "src"
        );

    }


    /* NAME */

    name.textContent =
        participant.name ||
        "PARTICIPANT";


    /* INFORMATION */

    info.textContent =
        [
            participant.position,
            participant.organization

        ]
        .filter(Boolean)
        .join(" • ") ||

        "Registered Participant";


    /* MESSAGE */

    message.textContent =
        participant.message ||
        "";


    /* TTS */

    speakParticipant(
        participant
    );

}


/* =====================================================
   MAIN SCAN CHECK
===================================================== */

async function checkLatestScan(){

    try{

        /*
         * STEP 1
         * Get latest scan only.
         */

        const scanResult =
            await db
                .from("scan_history")
                .select(
                    "id, participant_id, scanned_at"
                )
                .order(
                    "id",
                    {
                        ascending:false
                    }
                )
                .limit(1);


        if(
            scanResult.error
        ){

            console.error(
                "SCAN HISTORY ERROR:",
                scanResult.error
            );

            return;

        }


        const scans =
            scanResult.data;


        if(
            !scans ||
            scans.length === 0
        ){

            return;

        }


        const latestScan =
            scans[0];


        /*
         * Already displayed?
         */

        if(
            latestScan.id ===
            lastScanId
        ){

            return;

        }


        console.log(
            "NEW SCAN:",
            latestScan
        );


        /*
         * Remember scan
         */

        lastScanId =
            latestScan.id;


        /*
         * STEP 2
         * Get participant separately.
         */

        const participantResult =
            await db
                .from("participants")
                .select("*")
                .eq(
                    "id",
                    latestScan.participant_id
                )
                .limit(1);


        if(
            participantResult.error
        ){

            console.error(
                "PARTICIPANT ERROR:",
                participantResult.error
            );

            return;

        }


        const participants =
            participantResult.data;


        if(
            !participants ||
            participants.length === 0
        ){

            console.error(
                "Participant not found:",
                latestScan.participant_id
            );

            return;

        }


        const participant =
            participants[0];


        /*
         * STEP 3
         * Update LED wall.
         */

        displayParticipant(
            participant
        );


    }

    catch(error){

        console.error(
            "LED DISPLAY ERROR:",
            error
        );

    }

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize(){

    console.log(
        "LED WALL INITIALIZING..."
    );


    await loadTTSSettings();


    /*
     * Get current latest scan ID.
     *
     * We intentionally DON'T display
     * an old scan when the LED page opens.
     */

    try{

        const result =
            await db
                .from("scan_history")
                .select("id")
                .order(
                    "id",
                    {
                        ascending:false
                    }
                )
                .limit(1);


        if(
            result.data &&
            result.data.length
        ){

            lastScanId =
                result.data[0].id;

        }

    }

    catch(error){

        console.error(
            "Initial scan check:",
            error
        );

    }


    /*
     * Start watching.
     */

    setInterval(
        checkLatestScan,
        700
    );


    console.log(
        "LED WALL READY"
    );

}


initialize();


/* =====================================================
   REFRESH TTS SETTINGS EVERY 10 SECONDS
===================================================== */

setInterval(
    loadTTSSettings,
    10000
);


/* =====================================================
   DOUBLE CLICK FULLSCREEN
===================================================== */

document.addEventListener(
    "dblclick",
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }

        }

        catch(error){

            console.error(
                "Fullscreen:",
                error
            );

        }

    }
);


</script>

</body>

</html>
