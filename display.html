<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LED Wall Display</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at center,
            #172554 0%,
            #020617 55%,
            #000000 100%
        );

    color: white;
}


/* =========================================================
   MAIN LED DISPLAY
========================================================= */

.led {
    width: 100vw;
    height: 100vh;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    overflow: hidden;
}


/* =========================================================
   BACKGROUND EFFECT
========================================================= */

.led::before {

    content: "";

    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 900px;
    max-height: 900px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(37,99,235,.30),
            transparent 65%
        );

    filter: blur(30px);

    animation:
        backgroundPulse 5s ease-in-out infinite;

    pointer-events: none;
}


@keyframes backgroundPulse {

    0% {
        transform: scale(.9);
        opacity: .5;
    }

    50% {
        transform: scale(1.1);
        opacity: .9;
    }

    100% {
        transform: scale(.9);
        opacity: .5;
    }

}


/* =========================================================
   LED CONTENT
========================================================= */

.led-inner {

    width: 92vw;
    height: 92vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;

    z-index: 2;

    padding: 2vh 3vw;

}


/* =========================================================
   WELCOME
========================================================= */

.led-welcome {

    font-size:
        clamp(
            30px,
            4vw,
            80px
        );

    font-weight: 800;

    letter-spacing:
        clamp(
            2px,
            .5vw,
            8px
        );

    text-transform: uppercase;

    margin-bottom: 2vh;

    text-shadow:
        0 0 15px rgba(255,255,255,.5),
        0 0 35px rgba(37,99,235,.8);

}


/* =========================================================
   PHOTO
========================================================= */

.led-photo {

    width:
        clamp(
            180px,
            25vh,
            420px
        );

    height:
        clamp(
            180px,
            25vh,
            420px
        );

    border-radius: 50%;

    object-fit: cover;

    border:
        clamp(
            4px,
            .5vw,
            10px
        )
        solid
        white;

    box-shadow:

        0 0 20px rgba(255,255,255,.35),

        0 0 50px rgba(37,99,235,.8);

    background: #1e293b;

    display: block;

    margin-bottom: 2vh;

}


/* =========================================================
   NAME
========================================================= */

.led-name {

    font-size:
        clamp(
            36px,
            6vw,
            110px
        );

    line-height: 1.05;

    font-weight: 900;

    text-transform: uppercase;

    max-width: 95vw;

    word-wrap: break-word;

    text-shadow:

        0 0 10px rgba(255,255,255,.6),

        0 0 30px rgba(37,99,235,.9),

        0 0 60px rgba(37,99,235,.6);

}


/* =========================================================
   INFORMATION
========================================================= */

.led-info {

    margin-top: 1.5vh;

    font-size:
        clamp(
            20px,
            3vw,
            55px
        );

    font-weight: 600;

    max-width: 90vw;

    line-height: 1.2;

    text-shadow:
        0 0 15px rgba(255,255,255,.5);

}


/* =========================================================
   MESSAGE
========================================================= */

.led-message {

    margin-top: 2vh;

    font-size:
        clamp(
            18px,
            2.3vw,
            42px
        );

    max-width: 85vw;

    line-height: 1.3;

    opacity: .95;

}


/* =========================================================
   FOOTER
========================================================= */

.led-footer {

    position: absolute;

    bottom: 1.5vh;

    left: 0;

    width: 100%;

    text-align: center;

    font-size:
        clamp(
            10px,
            1vw,
            20px
        );

    letter-spacing: 3px;

    opacity: .45;

}


/* =========================================================
   TTS CONTROL PANEL
========================================================= */

#ttsControls {

    position: fixed;

    right: 20px;

    top: 20px;

    z-index: 9999;

    display: flex;

    gap: 8px;

    align-items: center;

    flex-wrap: wrap;

    padding: 10px 12px;

    border-radius: 12px;

    background:
        rgba(0,0,0,.75);

    color: white;

    font-family:
        Arial,
        sans-serif;

    font-size: 14px;

    backdrop-filter:
        blur(10px);

    transition:
        opacity .3s ease,
        transform .3s ease;

}


/* =========================================================
   BUTTONS
========================================================= */

#ttsControls button,
#ttsControls select {

    font-size: 14px;

    padding: 8px 10px;

    border-radius: 8px;

    border: 0;

    cursor: pointer;

}


#ttsEnable {

    background: #2563eb;

    color: white;

    font-weight: bold;

}


#ttsTest {

    background: #475569;

    color: white;

}


#fullscreenBtn {

    background: #16a34a;

    color: white;

    font-weight: bold;

}


/* =========================================================
   TTS STATUS
========================================================= */

#ttsStatus {

    font-weight: bold;

}


/* =========================================================
   IMMERSIVE MODE
========================================================= */

body.immersive #ttsControls {

    opacity: 0;

    transform:
        translateY(-20px);

    pointer-events: none;

}


body.immersive #ttsControls:hover {

    opacity: 1;

    pointer-events: auto;

}


/* =========================================================
   FULLSCREEN MESSAGE
========================================================= */

#immersiveHint {

    position: fixed;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 10000;

    background:
        rgba(0,0,0,.8);

    padding: 12px 20px;

    border-radius: 30px;

    font-size: 14px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .4s ease;

}


#immersiveHint.show {

    opacity: 1;

}


/* =========================================================
   MOBILE / SMALL SCREEN
========================================================= */

@media(max-width:700px){

    #ttsControls {

        right: 8px;

        top: 8px;

        font-size: 11px;

        max-width: 95vw;

    }

    #ttsControls button,
    #ttsControls select {

        font-size: 11px;

        padding: 6px 8px;

    }

}


/* =========================================================
   FULLSCREEN CSS
========================================================= */

:fullscreen {

    width: 100vw;

    height: 100vh;

}


:-webkit-full-screen {

    width: 100vw;

    height: 100vh;

}

</style>

</head>


<body class="led">


<!-- ======================================================
     TTS / CONTROL PANEL
======================================================= -->

<div id="ttsControls">

    <button
        id="ttsEnable"
        type="button"
    >
        🔊 ENABLE TTS
    </button>


    <button
        id="ttsTest"
        type="button"
    >
        TEST
    </button>


    <button
        id="fullscreenBtn"
        type="button"
    >
        ⛶ IMMERSIVE
    </button>


    <label>

        <input
            id="ttsAuto"
            type="checkbox"
            checked
        >

        Auto

    </label>


    <select
        id="ttsVoice"
    >

        <option value="">
            Default voice
        </option>

    </select>


    <span id="ttsStatus">
        TTS OFF
    </span>

</div>


<!-- ======================================================
     IMMERSIVE HINT
======================================================= -->

<div id="immersiveHint">
    Press ESC to exit fullscreen
</div>


<!-- ======================================================
     LED DISPLAY
======================================================= -->

<main class="led-inner">


    <div class="led-welcome">

        WELCOME

    </div>


    <img
        id="photo"
        class="led-photo"
        alt="Participant"
    >


    <div
        id="name"
        class="led-name"
    >

        READY TO SCAN

    </div>


    <div
        id="info"
        class="led-info"
    >

        Waiting for the next QR scan...

    </div>


    <div
        id="message"
        class="led-message"
    >

    </div>


    <div class="led-footer">

        QR EVENT INFORMATION SYSTEM

    </div>


</main>


<!-- ======================================================
     SUPABASE CONFIG
======================================================= -->

<script src="config.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const db =
    supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let lastScanId = null;

let ttsEnabled = false;

let voices = [];

const ttsSupported =
    "speechSynthesis" in window;


/* =========================================================
   LOAD TTS VOICES
========================================================= */

function loadVoices(){

    if(!ttsSupported)
        return;


    voices =
        speechSynthesis.getVoices() || [];


    const select =
        document.getElementById(
            "ttsVoice"
        );


    select.innerHTML =
        '<option value="">Default voice</option>';


    voices.forEach(
        function(voice,index){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                voice.name +
                " — " +
                voice.lang;


            select.appendChild(
                option
            );

        }
    );

}


if(ttsSupported){

    speechSynthesis.onvoiceschanged =
        loadVoices;

    loadVoices();

}


/* =========================================================
   TTS SPEECH
========================================================= */

function speakParticipant(participant){

    if(
        !ttsSupported ||
        !ttsEnabled
    ){

        return;

    }


    let speech =
        "Now welcoming " +
        (
            participant.name ||
            "participant"
        ) +
        ".";


    if(participant.position){

        speech +=
            " " +
            participant.position +
            ".";

    }


    if(participant.organization){

        speech +=
            " From " +
            participant.organization +
            ".";

    }


    if(participant.message){

        speech +=
            " " +
            participant.message;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            speech
        );


    const voiceSelect =
        document.getElementById(
            "ttsVoice"
        );


    if(
        voiceSelect.value !== "" &&
        voices[
            Number(
                voiceSelect.value
            )
        ]
    ){

        utterance.voice =
            voices[
                Number(
                    voiceSelect.value
                )
            ];

    }


    utterance.rate =
        1;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   TTS ENABLE
========================================================= */

document
    .getElementById("ttsEnable")
    .addEventListener(
        "click",
        function(){

            if(!ttsSupported){

                alert(
                    "Text-to-Speech is not supported by this browser."
                );

                return;

            }


            ttsEnabled =
                !ttsEnabled;


            this.textContent =
                ttsEnabled
                    ? "🔊 TTS ENABLED"
                    : "🔇 TTS DISABLED";


            document
                .getElementById(
                    "ttsStatus"
                )
                .textContent =
                    ttsEnabled
                        ? "TTS ON"
                        : "TTS OFF";


            speechSynthesis.cancel();


            if(ttsEnabled){

                const test =
                    new SpeechSynthesisUtterance(
                        "Text to speech is now enabled."
                    );


                speechSynthesis.speak(
                    test
                );

            }

        }
    );


/* =========================================================
   TTS TEST
========================================================= */

document
    .getElementById("ttsTest")
    .addEventListener(
        "click",
        function(){

            ttsEnabled =
                true;


            document
                .getElementById(
                    "ttsEnable"
                )
                .textContent =
                    "🔊 TTS ENABLED";


            document
                .getElementById(
                    "ttsStatus"
                )
                .textContent =
                    "TTS ON";


            speakParticipant({

                name:
                    "Test Participant",

                position:
                    "Guest",

                organization:
                    "San Miguel",

                message:
                    "Welcome to the event!"

            });

        }
    );


/* =========================================================
   ENTER FULLSCREEN
========================================================= */

async function enterFullscreen(){

    try{

        if(
            !document.fullscreenElement &&
            !document.webkitFullscreenElement
        ){

            if(
                document.documentElement.requestFullscreen
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }

            else if(
                document
                    .documentElement
                    .webkitRequestFullscreen
            ){

                await document
                    .documentElement
                    .webkitRequestFullscreen();

            }

        }


        document.body.classList.add(
            "immersive"
        );


        showImmersiveHint();


    }

    catch(error){

        console.error(
            "Fullscreen error:",
            error
        );

        alert(
            "Fullscreen was blocked by the browser. " +
            "Click the page first and try again."
        );

    }

}


/* =========================================================
   EXIT FULLSCREEN
========================================================= */

async function exitFullscreen(){

    try{

        if(
            document.exitFullscreen &&
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

        else if(
            document.webkitExitFullscreen &&
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }

    catch(error){

        console.error(error);

    }


    document.body.classList.remove(
        "immersive"
    );

}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

document
    .getElementById(
        "fullscreenBtn"
    )
    .addEventListener(
        "click",
        function(){

            if(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            ){

                exitFullscreen();

            }

            else{

                enterFullscreen();

            }

        }
    );


/* =========================================================
   FULLSCREEN STATE CHANGE
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        const button =
            document.getElementById(
                "fullscreenBtn"
            );


        if(document.fullscreenElement){

            document.body.classList.add(
                "immersive"
            );


            button.textContent =
                "⛶ EXIT IMMERSIVE";

        }

        else{

            document.body.classList.remove(
                "immersive"
            );


            button.textContent =
                "⛶ IMMERSIVE";

        }

    }
);


/* =========================================================
   WEBKIT FULLSCREEN
========================================================= */

document.addEventListener(
    "webkitfullscreenchange",
    function(){

        const button =
            document.getElementById(
                "fullscreenBtn"
            );


        if(
            document.webkitFullscreenElement
        ){

            document.body.classList.add(
                "immersive"
            );


            button.textContent =
                "⛶ EXIT IMMERSIVE";

        }

        else{

            document.body.classList.remove(
                "immersive"
            );


            button.textContent =
                "⛶ IMMERSIVE";

        }

    }
);


/* =========================================================
   IMMERSIVE HINT
========================================================= */

function showImmersiveHint(){

    const hint =
        document.getElementById(
            "immersiveHint"
        );


    hint.classList.add(
        "show"
    );


    setTimeout(
        function(){

            hint.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================================
   DOUBLE CLICK = FULLSCREEN
========================================================= */

document
    .querySelector(".led-inner")
    .addEventListener(
        "dblclick",
        function(){

            enterFullscreen();

        }
    );


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /*
           F11 normally belongs to Chrome.
           We don't prevent it.
        */


        /*
           F = Web fullscreen
        */

        if(
            event.key.toLowerCase() === "f"
        ){

            enterFullscreen();

        }


        /*
           T = TTS
        */

        if(
            event.key.toLowerCase() === "t"
        ){

            document
                .getElementById(
                    "ttsEnable"
                )
                .click();

        }

    }
);


/* =========================================================
   DISPLAY PARTICIPANT
========================================================= */

function displayParticipant(
    participant
){

    const photo =
        document.getElementById(
            "photo"
        );


    const name =
        document.getElementById(
            "name"
        );


    const info =
        document.getElementById(
            "info"
        );


    const message =
        document.getElementById(
            "message"
        );


    /* PHOTO */

    if(participant.photo_url){

        photo.src =
            participant.photo_url;

    }

    else{

        photo.removeAttribute(
            "src"
        );

    }


    /* NAME */

    name.textContent =
        participant.name ||
        "PARTICIPANT";


    /* INFORMATION */

    info.textContent =
        [
            participant.position,
            participant.organization
        ]
        .filter(Boolean)
        .join(" • ") ||
        "Registered Participant";


    /* MESSAGE */

    message.textContent =
        participant.message ||
        "";


    /* TTS */

    if(
        document
            .getElementById(
                "ttsAuto"
            )
            .checked
    ){

        speakParticipant(
            participant
        );

    }

}


/* =========================================================
   POLL SUPABASE FOR LATEST SCAN
========================================================= */

async function poll(){

    try{

        const result =
            await db
                .from("scan_history")
                .select(
                    "id,scanned_at,participants(*)"
                )
                .order(
                    "id",
                    {
                        ascending:false
                    }
                )
                .limit(1)
                .single();


        const data =
            result.data;


        const error =
            result.error;


        if(error)
            return;


        if(!data)
            return;


        if(
            data.id ===
            lastScanId
        ){

            return;

        }


        lastScanId =
            data.id;


        const participant =
            data.participants;


        if(!participant)
            return;


        displayParticipant(
            participant
        );


    }

    catch(error){

        console.error(
            "Display polling error:",
            error
        );

    }

}


/* =========================================================
   START POLLING
========================================================= */

poll();


setInterval(
    poll,
    1000
);


/* =========================================================
   AUTO IMMERSIVE IF URL HAS ?fullscreen
========================================================= */

if(
    new URLSearchParams(
        window.location.search
    ).has("fullscreen")
){

    /*
       Browsers normally require a user gesture
       before allowing fullscreen, so we don't
       force it automatically.
    */

    document.body.classList.add(
        "immersive"
    );

}

</script>

</body>

</html>
