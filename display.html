<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED Wall Display</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vh 5vw;position:relative;overflow:hidden;background:radial-gradient(circle at center,#172554 0%,#020617 55%,#000 100%)}.screen:before{content:"";position:absolute;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.3),transparent 65%);filter:blur(35px);animation:p 6s ease-in-out infinite}@keyframes p{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.1);opacity:.9}}.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.welcome{font-size:clamp(28px,4vw,80px);font-weight:900;letter-spacing:.5vw;margin-bottom:2vh;text-shadow:0 0 15px #fff8,0 0 35px #2563eb}.photo{width:clamp(170px,25vh,430px);height:clamp(170px,25vh,430px);border-radius:50%;object-fit:cover;border:clamp(4px,.5vw,10px) solid #fff;box-shadow:0 0 25px #fff6,0 0 60px #2563eb;background:#1e293b;margin-bottom:2vh}.name{font-size:clamp(34px,6vw,110px);font-weight:900;line-height:1.05;max-width:95vw;text-transform:uppercase;text-shadow:0 0 12px #fff9,0 0 35px #2563eb}.info{font-size:clamp(20px,3vw,55px);font-weight:600;margin-top:1.5vh;max-width:90vw;line-height:1.2}.message{font-size:clamp(18px,2.3vw,42px);max-width:85vw;line-height:1.3;margin-top:2vh}.footer{position:absolute;bottom:1.5vh;width:100%;font-size:clamp(9px,1vw,18px);letter-spacing:3px;opacity:.3}@keyframes show{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}.content.new{animation:show .7s ease}</style></head><body><main class="screen"><div id="content" class="content"><div class="welcome">WELCOME</div><img id="photo" class="photo" alt=""><div id="name" class="name">READY TO SCAN</div><div id="info" class="info">Waiting for the next QR scan...</div><div id="message" class="message"></div><div class="footer">QR EVENT INFORMATION SYSTEM</div></div></main><script>const URL="https://bduudxtfqyswgwimvzpr.supabase.co",KEY="sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop",db=supabase.createClient(URL,KEY);let last=null,settings={enabled:true,voice:"",rate:1,pitch:1,volume:1},voices=[];function lv(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices()||[]}if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=lv;lv()}async function ls(){try{const{data,error}=await db.from('system_settings').select('*').eq('id',1).maybeSingle();if(error)throw error;if(data)settings={enabled:data.tts_enabled!==false,voice:data.tts_voice||'',rate:Number(data.tts_rate)||1,pitch:Number(data.tts_pitch)||1,volume:Number(data.tts_volume)||1}}catch(e){console.error(e)}}function speak(p){if(!settings.enabled||!('speechSynthesis'in window))return;let s='Now welcoming '+(p.name||'participant')+'.';if(p.position)s+=' '+p.position+'.';if(p.organization)s+=' From '+p.organization+'.';if(p.message)s+=' '+p.message;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s),v=voices.find(x=>x.name===settings.voice);if(v)u.voice=v;u.rate=settings.rate;u.pitch=settings.pitch;u.volume=settings.volume;speechSynthesis.speak(u)}function show(p){const c=$('content');c.classList.remove('new');void c.offsetWidth;c.classList.add('new');$('photo').src=p.photo_url||'';$('name').textContent=p.name||'PARTICIPANT';$('info').textContent=[p.position,p.organization].filter(Boolean).join(' • ')||'Registered Participant';$('message').textContent=p.message||'';speak(p)}function $(x){return document.getElementById(x)}async function poll(){try{const{data,error}=await db.from('scan_history').select('id,scanned_at,participants(*)').order('id',{ascending:false}).limit(1).maybeSingle();if(error||!data||data.id===last)return;last=data.id;if(data.participants)show(data.participants)}catch(e){console.error(e)}}ls();poll();setInterval(poll,1000);setInterval(ls,10000);</script></body></html>
