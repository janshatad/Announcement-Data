<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Wall Display</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;align-items:center;justify-content:center}.screen{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at center,#172554 0%,#020617 55%,#000 100%)}.screen:before{content:"";position:absolute;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.3),transparent 65%);filter:blur(35px);animation:pulse 6s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.1);opacity:.9}}.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 5vw}.welcome{font-size:clamp(28px,4vw,80px);font-weight:900;letter-spacing:clamp(2px,.5vw,8px);margin-bottom:2vh;text-shadow:0 0 15px rgba(255,255,255,.5),0 0 35px rgba(37,99,235,.8)}.photo{width:clamp(170px,25vh,430px);height:clamp(170px,25vh,430px);border-radius:50%;object-fit:cover;border:clamp(4px,.5vw,10px) solid #fff;box-shadow:0 0 25px rgba(255,255,255,.35),0 0 60px rgba(37,99,235,.85);background:#1e293b;margin-bottom:2vh}.name{font-size:clamp(34px,6vw,110px);font-weight:900;line-height:1.05;max-width:95vw;word-wrap:break-word;text-transform:uppercase;text-shadow:0 0 12px rgba(255,255,255,.6),0 0 35px rgba(37,99,235,.9)}.info{font-size:clamp(20px,3vw,55px);font-weight:600;margin-top:1.5vh;max-width:90vw;line-height:1.2}.message{font-size:clamp(18px,2.3vw,42px);max-width:85vw;line-height:1.3;margin-top:2vh}.footer{position:absolute;bottom:1.5vh;left:0;width:100%;font-size:clamp(9px,1vw,18px);letter-spacing:3px;opacity:.35}
</style>
</head>
<body>
<div id="startOverlay" style="position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-family:Arial,sans-serif">
  <button id="startBtn" style="font-size:clamp(22px,3vw,42px);font-weight:800;padding:18px 32px;border:0;border-radius:14px;background:#2563eb;color:#fff;cursor:pointer;box-shadow:0 0 35px rgba(37,99,235,.55)">⛶ START LED DISPLAY</button>
  <div id="startStatus" style="margin-top:15px;color:#cbd5e1;font-size:16px">Click once to enable fullscreen and LED-wall voice.</div>
</div>
<main class="screen"><div class="content"><div class="welcome">WELCOME</div><img id="photo" class="photo" alt="Participant"><div id="name" class="name">READY TO SCAN</div><div id="info" class="info">Waiting for the next QR scan...</div><div id="message" class="message"></div><div class="footer">QR EVENT INFORMATION SYSTEM</div></div></main>
<script>
const SUPABASE_URL="https://bduudxtfqyswgwimvzpr.supabase.co";
const SUPABASE_KEY="sb_publishable_Qf9weBIOViUWuNA6STFB2A_CFMMevop";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lastScanId=null;
let tts={enabled:true,voice:"",rate:1,pitch:1,volume:1};
let voices=[];
let ttsUnlocked=false;

function loadVoices(){if("speechSynthesis" in window)voices=speechSynthesis.getVoices()||[]}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}

async function loadTTS(){
 try{
  const {data,error}=await db.from("system_settings").select("tts_enabled,tts_voice,tts_rate,tts_pitch,tts_volume").eq("id",1).maybeSingle();
  if(error){console.warn("TTS settings unavailable:",error.message);return}
  if(data)tts={enabled:data.tts_enabled!==false,voice:data.tts_voice||"",rate:Number(data.tts_rate)||1,pitch:Number(data.tts_pitch)||1,volume:Number(data.tts_volume)??1};
 }catch(e){console.warn(e)}
}

function speak(p){
 if(!tts.enabled||!("speechSynthesis" in window)||!ttsUnlocked)return;
 let text="Now welcoming "+(p.name||"participant")+".";
 if(p.position)text+=" "+p.position+".";
 if(p.organization)text+=" From "+p.organization+".";
 if(p.message)text+=" "+p.message;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 const v=voices.find(x=>x.name===tts.voice);if(v)u.voice=v;
 u.rate=tts.rate;u.pitch=tts.pitch;u.volume=tts.volume;speechSynthesis.speak(u);
}

async function displayLatestScan(){
 try{
  // First get the latest scan record only. This avoids relying on a PostgREST
  // relationship/schema-cache embedding for participants.
  const {data:scan,error:scanError}=await db.from("scan_history").select("id,participant_id,scanned_at").order("id",{ascending:false}).limit(1).maybeSingle();
  if(scanError){console.error("scan_history read failed:",scanError);return}
  if(!scan||scan.id===lastScanId)return;

  // Then retrieve the participant directly by its ID.
  const {data:p,error:pError}=await db.from("participants").select("*").eq("id",scan.participant_id).maybeSingle();
  if(pError){console.error("participant read failed:",pError);return}
  if(!p)return;

  lastScanId=scan.id;
  document.getElementById("photo").src=p.photo_url||"";
  document.getElementById("name").textContent=p.name||"PARTICIPANT";
  document.getElementById("info").textContent=[p.position,p.organization].filter(Boolean).join(" • ")||"Registered Participant";
  document.getElementById("message").textContent=p.message||"";
  speak(p);
 }catch(e){console.error("LED polling error:",e)}
}

async function activateLED(){
  const status=document.getElementById("startStatus");
  try{
    await loadTTS();
    ttsUnlocked=true;
    if("speechSynthesis" in window){
      speechSynthesis.cancel();
      speechSynthesis.resume();
      const u=new SpeechSynthesisUtterance("LED wall display is ready.");
      const v=voices.find(x=>x.name===tts.voice);
      if(v)u.voice=v;
      u.rate=tts.rate;u.pitch=tts.pitch;u.volume=tts.volume;
      speechSynthesis.speak(u);
    }
    if(document.documentElement.requestFullscreen){
      try{await document.documentElement.requestFullscreen();}catch(e){console.warn("Fullscreen was blocked:",e)}
    }
    document.getElementById("startOverlay").style.display="none";
    displayLatestScan();
  }catch(e){
    console.error(e);
    status.textContent="Could not start LED display. Click again.";
  }
}

document.getElementById("startBtn").addEventListener("click",activateLED);
document.addEventListener("dblclick",activateLED);
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement){
    document.getElementById("startOverlay").style.display="flex";
  }
});

loadTTS();
displayLatestScan();
setInterval(displayLatestScan,1000);
setInterval(loadTTS,10000);
</script>
</body>
</html>
